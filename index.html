/* ---------- 말랑이 4종 (몽글이와 놀아 주기) ---------- */
const SQUISH={
  1:{name:'색 젤리볼', sense:'시각', hint:'꾹 누르고 있으면 젤리가 눌리고, 손을 떼면 색이 퍼져요. 10번 꾹.'},
  2:{name:'뽁뽁이', sense:'청각', hint:'하나씩 눌러 터뜨려요. 뽁 소리에 귀를 기울여 봐요.'},
  3:{name:'말랑 찹쌀떡', sense:'미각', hint:'떡을 잡아당겼다가 놓아요. 천천히 늘이면 더 쫀득해요. 8번.'},
  4:{name:'왁뿌볼', sense:'오감', hint:'탕후루처럼 단단한 겉을 톡톡 두드려 와장창 깨고, 말랑한 속을 꾹꾹 눌러요.'}
};
let actx=null;
function blip(f,d){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.15,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+(d||.12)); o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+(d||.12)); }catch(e){} }
function buzz(p){ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} }
function openSquish(host,onDone,toy){
  const n=toy||W().n, T=SQUISH[n];
  host.innerHTML=`<div class="squish"><div class="sqhead"><b>${T.name}</b><span>말랑이</span></div><p class="note">${T.hint}</p><div class="sqstage" id="sq"></div><div class="sqcount" id="sqc"></div></div>`;
  const st=host.querySelector('#sq'), cnt=host.querySelector('#sqc'); let done=false;
  const finish=()=>{ if(done) return; done=true; cnt.textContent='다 놀았다! 몽글이 기분 +'; buzz([20,40,20]); onDone&&onDone(); };
  if(n===1){ // 젤리볼: 누르는 시간만큼 눌리고, 떼면 색 파문
    let k=0; const cols=['#ff8fa3','#ffd25a','#8fe08a','#7cc8ff','#c9a7ff'];
    st.innerHTML='<div class="jelly" id="jb"></div>'; const jb=st.querySelector('#jb'); let t0=0, raf=0;
    const press=e=>{ e.preventDefault(); t0=performance.now(); const loop=()=>{ const p=Math.min(1,(performance.now()-t0)/900); jb.style.transform=`scale(${1+p*.25},${1-p*.3})`; raf=requestAnimationFrame(loop); }; loop(); buzz(10); };
    const rel=()=>{ if(!t0) return; cancelAnimationFrame(raf); const p=Math.min(1,(performance.now()-t0)/900); t0=0; jb.style.transform=''; jb.animate([{transform:`scale(${1-p*.15},${1+p*.2})`},{transform:'scale(1)'}],{duration:450,easing:'cubic-bezier(.2,1.6,.4,1)'});
      const c=cols[k%cols.length]; jb.style.background=`radial-gradient(circle at 35% 30%,#fff9,${c})`; const r=document.createElement('i'); r.className='ripple'; r.style.borderColor=c; st.appendChild(r); setTimeout(()=>r.remove(),800); blip(300+p*300,.15); buzz(25);
      k++; cnt.textContent=`꾹 ${Math.min(k,10)} / 10`; if(k>=10) finish(); };
    jb.addEventListener('pointerdown',press); ['pointerup','pointercancel','pointerleave'].forEach(t=>jb.addEventListener(t,rel)); cnt.textContent='꾹 0 / 10';
  } else if(n===2){ // 뽁뽁이
    const N=20; st.innerHTML=`<div class="wrap">${Array.from({length:N},(_,i)=>`<button class="bub" data-i="${i}" aria-label="뽁뽁이 ${i+1}"></button>`).join('')}</div>`; let k=0;
    st.querySelectorAll('.bub').forEach(x=>x.onclick=()=>{ if(x.classList.contains('pop')) return; x.classList.add('pop'); k++; blip(600+Math.random()*500,.06); buzz(12); cnt.textContent=`뽁 ${k} / ${N}`; if(k>=N) finish(); });
    cnt.textContent=`뽁 0 / ${N}`;
  } else if(n===3){ // 찹쌀떡 늘이기
    st.innerHTML='<div class="mochi" id="mc"><i></i><i></i></div>'; const mc=st.querySelector('#mc'); let sx=0,sy=0,drag=false,k=0,maxd=0;
    mc.addEventListener('pointerdown',e=>{ drag=true; sx=e.clientX; sy=e.clientY; maxd=0; mc.setPointerCapture(e.pointerId); buzz(8); });
    mc.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-sx, dy=e.clientY-sy, d=Math.min(140,Math.hypot(dx,dy)); maxd=Math.max(maxd,d); const a=Math.atan2(dy,dx)*180/Math.PI; mc.style.transform=`rotate(${a}deg) scale(${1+d/110},${1-d/360}) rotate(${-a}deg)`; });
    const up=()=>{ if(!drag) return; drag=false; mc.style.transform=''; mc.animate([{transform:'scale(.85,1.15)'},{transform:'scale(1.06,.94)'},{transform:'scale(1)'}],{duration:600,easing:'ease-out'});
      if(maxd>40){ k++; blip(200+maxd,.2); buzz([15,30,15]); cnt.textContent=`쫀득 ${Math.min(k,8)} / 8`; if(k>=8) finish(); } else cnt.textContent='조금 더 길게 늘여 봐요'; };
    mc.addEventListener('pointerup',up); mc.addEventListener('pointercancel',up); cnt.textContent='쫀득 0 / 8';
  } else waxToy(st,cnt,()=>{ buzz([20,40,20]); if(!done){ done=true; onDone&&onDone(); } });
}
function crunch(v,d){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const n=Math.floor(actx.sampleRate*(d||.09)), buf=actx.createBuffer(1,n,actx.sampleRate), a=buf.getChannelData(0);
  for(let i=0;i<n;i++) a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5)*(Math.random()<.35?1:.25);
  const s=actx.createBufferSource(); s.buffer=buf; const f=actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=1800; const g=actx.createGain(); g.gain.value=v||.5; s.connect(f); f.connect(g); g.connect(actx.destination); s.start(); }catch(e){} }
function waxToy(st,cnt,finish){
  const COL=[['#ff7f96','#ffd0d9'],['#ffc23d','#ffe9a8'],['#5fcf7a','#c9f2d2'],['#58b4ff','#cfe8ff'],['#b08cff','#e3d6ff'],['#ff9d5c','#ffdcc2']];
  let round=0;
  const start=()=>{ const c=COL[(round+Math.floor(Math.random()*COL.length))%COL.length]; const NEED=5+Math.floor(Math.random()*3); let hits=0, broke=false, sq=0;
    st.innerHTML=`<div class="wxb" id="wxb"><div class="wxcore" style="background:radial-gradient(circle at 35% 30%,#fff,${c[1]} 35%,${c[0]})"></div>
      <svg class="wxshell" viewBox="0 0 200 200"><defs><radialGradient id="wxg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[0]}"/></radialGradient></defs>
        <circle cx="100" cy="100" r="92" fill="url(#wxg)" stroke="#1a1917" stroke-width="5"/><ellipse cx="68" cy="58" rx="26" ry="14" fill="#fff" opacity=".75" transform="rotate(-30 68 58)"/><circle cx="128" cy="150" r="7" fill="#fff" opacity=".35"/><g id="wxcr" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></g><g id="wxcr2" fill="none" stroke="#1a1917" stroke-width="1" opacity=".5" stroke-linecap="round"></g></svg></div>
      <button class="bk yellow wxagain" id="wxa" hidden>하나 더 깨기</button>`;
    const box=st.querySelector('#wxb'), shell=st.querySelector('.wxshell'), core=st.querySelector('.wxcore'), cr=st.querySelector('#wxcr'), cr2=st.querySelector('#wxcr2');
    cnt.textContent='단단한 겉을 톡톡 두드려 깨요';
    const crack=(x,y)=>{ const k=3+Math.floor(Math.random()*3); for(let i=0;i<k;i++){ let a=Math.random()*Math.PI*2, px=x, py=y, d=`M${x.toFixed(1)} ${y.toFixed(1)}`; const seg=2+Math.floor(Math.random()*3)+hits;
        for(let j=0;j<seg;j++){ a+=(Math.random()-.5)*1.1; const L=10+Math.random()*16; px+=Math.cos(a)*L; py+=Math.sin(a)*L; if(Math.hypot(px-100,py-100)>88) break; d+=`L${px.toFixed(1)} ${py.toFixed(1)}`; }
        const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d',d); cr.appendChild(p); const q=p.cloneNode(); q.setAttribute('transform','translate(1 1.5)'); cr2.appendChild(q); } };
    const shatter=()=>{ broke=true; shell.style.display='none'; crunch(.9,.28); blip(140,.18); buzz([40,30,60]);
      for(let i=0;i<16;i++){ const s=document.createElement('i'); s.className='wxsh'; const a=Math.PI*2*i/16+Math.random()*.4, r=90+Math.random()*90; s.style.setProperty('--dx',Math.cos(a)*r+'px'); s.style.setProperty('--dy',(Math.sin(a)*r+40)+'px'); s.style.setProperty('--rot',(Math.random()*720-360)+'deg');
        s.style.background=i%3?c[0]:c[1]; s.style.width=(12+Math.random()*18)+'px'; s.style.height=(10+Math.random()*16)+'px'; s.style.clipPath=`polygon(${Math.random()*30}% 0,100% ${Math.random()*40}%,${60+Math.random()*40}% 100%,0 ${50+Math.random()*50}%)`; box.appendChild(s); setTimeout(()=>s.remove(),900); }
      core.classList.add('on'); core.animate([{transform:'scale(.7)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:420,easing:'cubic-bezier(.2,1.6,.4,1)'});
      cnt.textContent='와장창! 이제 말랑한 속을 꾹꾹 눌러요 0 / 5'; };
    box.addEventListener('pointerdown',e=>{ e.preventDefault();
      if(!broke){ const r=shell.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*200, y=(e.clientY-r.top)/r.height*200; if(Math.hypot(x-100,y-100)>94) return;
        hits++; crack(x,y); crunch(.35+hits*.06,.07); buzz(12+hits*3); box.animate([{transform:`translate(${(Math.random()-.5)*8}px,${(Math.random()-.5)*8}px)`},{transform:'none'}],{duration:120});
        if(hits>=NEED) shatter(); else cnt.textContent=['톡!','금이 갔다!','쩍…','거의 깨졌다!','조금만 더!','한 번만 더!','…'][Math.min(hits-1,6)];
