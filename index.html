<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>평범한 스파이 작전본부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;700;900&display=swap">
<style>
/* 레이아웃: 휴대폰 한 화면 게임. 위 HUD / 가운데 학교 지도(회색→색) / 아래 큼직한 블록 도크. 바텀시트로 장면을 띄움.
   의도적으로 한 가지 룩(게임 화면)만 쓰고, 모든 색을 명시함. */
:root{
  --ink:#1a1917; --paper:#f8edd3; --panel:#fffaf0;
  --fog:#a7adb5; --fog-d:#727985; --fog-l:#d7dbe0;
  --red:#d4502d; --red-d:#9a3519;
  --yellow:#f3c744; --yellow-d:#b98f17;
  --green:#3dbb5c; --green-d:#23863c;
  --sky:#4aa6e8; --sky-d:#2a76b3;
  --grass:#71c26b; --wood:#cfae7f; --tan:#d9bb8c; --bear:#b9663a;
  --muted:#5f574c;
  --f-display:"Do Hyeon","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:10px; --bw:3px;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0}
body{background:#1a1917;color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
#app{position:relative;max-width:460px;height:100%;margin:0 auto;background:var(--fog-l);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}

/* 블록 버튼 */
.bk{border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--panel);box-shadow:0 4px 0 var(--ink);padding:10px 14px;font-family:var(--f-display);font-size:18px;line-height:1.1;transition:transform .08s, box-shadow .08s}
.bk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.bk.green{background:var(--green);color:#fff;text-shadow:0 2px 0 var(--green-d)}
.bk.red{background:var(--red);color:#fff;text-shadow:0 2px 0 var(--red-d)}
.bk.yellow{background:var(--yellow)}
.bk.sky{background:var(--sky);color:#fff;text-shadow:0 2px 0 var(--sky-d)}
.bk[disabled]{opacity:.45;pointer-events:none}
.bk.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.bk{flex:1 1 0;min-width:0}

/* ---------- 로비 ---------- */
#lobby{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:20px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto;background:var(--red)}
#lobby>*{position:relative;z-index:1}
.stamp{font-family:var(--f-display);color:var(--ink);border:3px solid var(--ink);padding:2px 10px;border-radius:6px;transform:rotate(-4deg);font-size:14px;letter-spacing:.08em;background:var(--paper)}
.logo{text-align:center}
.logo h1{font-size:46px;line-height:1.02;color:var(--ink)}
.logo h1 span{color:var(--paper);-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink)}
.logo p{margin:6px 0 0;font-family:var(--f-display);font-size:16px;color:var(--ink);letter-spacing:.06em}
.hero{width:100%;max-width:360px;height:230px;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding-bottom:14px}
.hero::before{content:"";position:absolute;inset:-10px 0 0;z-index:-1;background:var(--paper);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);background-image:radial-gradient(rgba(26,25,23,.13) 1.2px,transparent 1.4px);background-size:7px 7px;background-color:var(--paper)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--paper);z-index:-1}
.hero .hbear{height:205px;width:auto;animation:sneak 1.6s ease-in-out infinite;transform-origin:50% 100%}
.hero .hchick{height:52px;width:auto;margin:0 0 2px -14px;animation:hop .8s ease-in-out infinite}
@keyframes sneak{50%{transform:translateY(-4px) rotate(-1.5deg)}}
@keyframes hop{50%{transform:translateY(-7px) rotate(4deg)}}
.avatar-stage{position:relative;width:74px;height:112px;margin-left:6px;display:grid;place-items:center}
.avatar-stage::after{content:"";position:absolute;bottom:0;width:56px;height:9px;border-radius:50%;background:rgba(26,25,23,.25)}
.avatar-stage svg{position:relative;z-index:1;width:70px;height:auto;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.idcard{width:100%;max-width:340px;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;box-shadow:0 4px 0 var(--ink)}
.hqnotice{width:100%;max-width:340px;background:#fff6c8;border:var(--bw) solid var(--ink);border-radius:var(--r);padding:8px 12px;font-size:14px;font-weight:700;box-shadow:0 4px 0 var(--ink)}
.hqnotice b{color:var(--red);margin-right:6px}
.idcard dt{color:var(--muted);font-weight:700}
.idcard dd{margin:0;font-weight:900;font-variant-numeric:tabular-nums}
.demo{width:100%;max-width:340px;background:rgba(26,25,23,.85);color:#fff;border-radius:var(--r);padding:10px 12px;font-size:13px}
.demo b{font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--yellow)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.demo .chip{border:2px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.demo .chip[aria-pressed="true"]{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}

/* ---------- 게임 ---------- */
#game{flex:1;display:flex;flex-direction:column;min-height:0}
#game>.hud{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--ink);color:#fff}
.hud .me{width:44px;height:44px;border:2px solid #fff;border-radius:8px;background:var(--fog-l);display:grid;place-items:center;overflow:hidden;padding:0;flex:none}
.hud .me svg{width:44px;height:auto;margin-top:14px}
.hud .meta{flex:1;min-width:0}
.hud .wk{font-family:var(--f-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .bar{height:12px;border:2px solid #fff;border-radius:6px;background:#3a4152;overflow:hidden;margin-top:4px}
.hud .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--yellow),var(--green),var(--sky));transition:width 1s}
.hudrank{margin-top:4px;font-size:12px}
.hudrank .sp-rank{transform-origin:left center}
.sp,.sp *{box-sizing:border-box}
.room.corr{filter:none;z-index:2;background:repeating-linear-gradient(90deg,#3d4350 0 22px,#4d5360 22px 44px);color:#fff;flex-direction:row!important;gap:8px!important;font-size:15px!important}
.corr small{color:#e6e9ee!important}
.pieces{display:flex;align-items:center;gap:4px;background:var(--yellow);color:var(--ink);border:2px solid #fff;border-radius:8px;padding:4px 8px;font-family:var(--f-display);font-size:18px;flex:none}
.pieces svg{width:18px;height:18px}

#map{position:relative;flex:1;min-height:0;overflow:hidden;--gray:1}
.wl{position:absolute;filter:grayscale(var(--gray));transition:filter 1.2s}
.wl.sky{inset:0 0 auto 0;height:40%;background:linear-gradient(#7ec3f2,#c8e7fb)}
.wl.sun{left:78%;top:4%;width:12%;aspect-ratio:1;border-radius:50%;background:#ffd84a;box-shadow:0 0 0 6px rgba(255,216,74,.35)}
.ground{inset:auto 0 0 0;height:36%;background:var(--grass);border-top:3px solid var(--ink)}
.bldg{left:5%;right:5%;top:11%;height:55%;background:#f1e3c8;border:3px solid var(--ink);border-radius:6px 6px 0 0}
.roof{left:3%;right:3%;top:6%;height:7%;background:var(--red);border:3px solid var(--ink);border-radius:6px;z-index:3;filter:none!important}
.roof b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);color:#fff;font-weight:400;font-size:19px;letter-spacing:.12em;text-shadow:0 2px 0 var(--red-d)}
.flr{position:absolute;left:5%;width:4%;font-family:var(--f-display);font-size:12px;color:var(--muted);text-align:center}
.room{position:absolute;border:3px solid var(--ink);border-radius:6px;background:var(--rc,#fff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:2px;font-family:var(--f-display);font-size:19px;line-height:1;box-shadow:0 3px 0 var(--ink);filter:grayscale(var(--gray));transition:filter 1.2s, transform .1s}
.room:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.room small{font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--muted)}
.room.hq{background:var(--yellow);filter:none;z-index:2}
.room.out{background:#b9e2a8}
.room.forest{background:#4f9b55;color:#fff}
.room.forest small{color:#e2f5dc}
.room.lock{background:repeating-linear-gradient(-45deg,#ffcc33 0 9px,#1a1917 9px 18px);filter:none;z-index:2}
.room.lock .plate{background:#fff;border:2px solid var(--ink);border-radius:4px;padding:2px 6px}
.room.lock small{background:var(--red);color:#fff;border-radius:3px;padding:1px 4px;font-weight:900}
.tape{background:repeating-linear-gradient(-45deg,#ffcc33 0 14px,#1a1917 14px 28px);border:var(--bw) solid var(--ink);border-radius:12px;padding:14px;display:grid;place-items:center}
.tape div{background:#fff;border:var(--bw) solid var(--ink);border-radius:8px;padding:10px 14px;text-align:center;transform:rotate(-2deg)}
.tape b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--red)}
.tape span{font-size:13px;font-weight:700}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badges span{border:2px solid var(--ink);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;background:var(--fog-l);color:var(--muted)}
.badges span.on{background:var(--yellow);color:var(--ink)}
.skytap{position:absolute;left:0;right:0;top:0;height:6%;border:0;background:transparent;z-index:4;padding:0}
.skychip{position:absolute;left:3%;top:1%;z-index:4;pointer-events:none;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 9px;font-family:var(--f-display);font-size:13px;box-shadow:0 2px 0 var(--ink)}
.skybox{position:relative;width:100%;aspect-ratio:4/5;max-height:58vh;border:var(--bw) solid var(--ink);border-radius:14px;overflow:hidden;--clear:0;background:linear-gradient(#3f8fd8,#9fd3f7 70%,#d6eefc)}
.skyfog{position:absolute;inset:0;background:radial-gradient(ellipse 60% 30% at 30% 25%,#b9bec6,transparent 70%),radial-gradient(ellipse 60% 30% at 70% 65%,#b2b8c0,transparent 70%),linear-gradient(#8e949d,#bfc4cb);transition:opacity 1.5s}
.skymsgs{position:absolute;inset:0}
.skym{position:absolute;transform:translateX(-50%);max-width:46%;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:5px 9px;font-size:12px;font-weight:700;line-height:1.35;text-align:center;box-shadow:0 0 0 10px rgba(159,211,247,.55),0 0 0 22px rgba(159,211,247,.25);animation:floaty 5s ease-in-out infinite alternate}
.skym i{display:block;font-style:normal;font-size:9px;color:var(--muted);font-weight:700}
.skym.new{animation:pop .6s,floaty 5s ease-in-out .6s infinite alternate;background:var(--yellow)}
@keyframes floaty{to{transform:translate(-50%,-6px)}}
.skyin{display:flex;gap:8px;margin-top:8px}
.petbtn{position:relative;width:44px;height:44px;flex:none;border:2px solid #fff;border-radius:8px;background:#3a4152;padding:2px;display:grid;place-items:center}
.petbtn svg{width:38px;height:38px}
.petbtn b{position:absolute;right:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid #fff}
.petstage{position:relative;height:230px;border:var(--bw) solid var(--ink);border-radius:14px;display:grid;place-items:center;overflow:hidden}
.petbox{width:150px;cursor:pointer;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 90%}
.petbox.s0{width:150px}.petbox.s1{width:125px}.petbox.s2{width:150px}.petbox.s3{width:170px}.petbox.s4{width:185px}
.petbox.boing{animation:boing .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes boing{30%{transform:scale(1.15,.85)}60%{transform:scale(.95,1.08)}}
.petsvg{width:100%;height:auto;display:block;overflow:visible}
.cksvg *{transform-box:fill-box}
.cksvg .ck-all{transform-origin:50% 100%;animation:ckbob 2.4s ease-in-out infinite}
@keyframes ckbob{50%{transform:scale(1.02,.97)}}
.cksvg .ck-head{transform-origin:50% 100%;animation:cktilt 5s ease-in-out infinite}
@keyframes cktilt{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-7deg)}90%{transform:rotate(5deg)}}
.cksvg .ck-wing.l{transform-origin:100% 0%;animation:ckflap 3.2s ease-in-out infinite}
.cksvg .ck-wing.r{transform-origin:0% 0%;animation:ckflap2 3.2s ease-in-out infinite}
@keyframes ckflap{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(22deg)}90%{transform:rotate(-6deg)}95%{transform:rotate(18deg)}}
@keyframes ckflap2{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-22deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-18deg)}}
.cksvg .ck-glint{animation:ckglint 4s ease-in-out infinite}
@keyframes ckglint{0%,85%,100%{opacity:.8}92%{opacity:.1}}
.petbox.eggshake{animation:eggshake .36s ease-in-out}
@keyframes eggshake{20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-5deg)}90%{transform:rotate(3deg)}}
.petbox.egghard{animation:egghard .1s linear infinite}
@keyframes egghard{0%{transform:translate(-3px,0) rotate(-5deg)}50%{transform:translate(3px,-2px) rotate(5deg)}100%{transform:translate(-3px,0) rotate(-5deg)}}
.petbox.eggopen{animation:none}
.eggsvg .egg-top,.eggsvg .egg-bot{transition:transform .7s cubic-bezier(.2,.8,.3,1),opacity .5s .9s}
.petbox.eggopen .egg-top{transform:translate(-26px,-78px) rotate(-70deg);opacity:0}
.petbox.eggopen .egg-bot{transform:translateY(10px) scale(1.04,.96);opacity:0}
.petbox.eggopen .egg-cr{display:none}
.petnew{position:absolute;inset:-8% -8% 4%;animation:petnew .8s cubic-bezier(.2,1.5,.4,1) both;transform-origin:50% 100%}
@keyframes petnew{0%{transform:translateY(22%) scale(.2);opacity:0}30%{opacity:1}60%{transform:translateY(-14%) scale(1.08,.94)}100%{transform:none}}
.eggchip{position:absolute;left:50%;top:52%;background:#d5d9df;border:1.5px solid #1a1917;pointer-events:none;animation:wxfly .85s cubic-bezier(.2,.7,.4,1) forwards;z-index:3}
.eggflash{position:absolute;inset:0;background:radial-gradient(circle,#fff 0,#fff8 35%,transparent 70%);pointer-events:none;animation:eggflash .45s ease-out forwards;z-index:4}
@keyframes eggflash{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1.6)}}
.petsvg *{transform-box:fill-box}
.petsvg .p-all{transform-origin:50% 100%;animation:pbreath 3.2s ease-in-out infinite}
.petsvg.zz .p-all{animation-duration:5s}
@keyframes pbreath{50%{transform:scale(1.025,.975)}}
.petsvg .eye{transform-origin:50% 50%;animation:pblink 4.6s infinite}
@keyframes pblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.petsvg .p-eyes{transform:translate(var(--ex,0px),var(--ey,0px));transition:transform .15s}
.petsvg .p-ear{transform-origin:50% 100%}
.petsvg .p-ear.l{animation:pearl 5.5s ease-in-out infinite}.petsvg .p-ear.r{animation:pearr 5.5s ease-in-out infinite}
@keyframes pearl{0%,82%,100%{transform:rotate(0)}86%{transform:rotate(-10deg)}90%{transform:rotate(4deg)}94%{transform:rotate(-6deg)}}
@keyframes pearr{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(10deg)}92%{transform:rotate(-4deg)}96%{transform:rotate(6deg)}}
.petsvg .p-tail{transform-origin:0% 100%;animation:ptail 1.4s ease-in-out infinite alternate}
@keyframes ptail{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
.petsvg.zz .p-tail,.petsvg.zz .p-ear{animation:none}
.petsvg .p-tuft{transform-origin:50% 100%;animation:ptuft 3.2s ease-in-out infinite}
@keyframes ptuft{50%{transform:rotate(4deg) translateY(-1px)}}
.petsvg .p-arm{transform-origin:50% 0%;transition:transform .2s}
.petsvg .p-star{transform-origin:50% 50%;animation:pstar 2s ease-in-out infinite}
@keyframes pstar{50%{transform:scale(1.25) rotate(20deg)}}
.petsvg .p-zzz{animation:pzzz 2.4s ease-in-out infinite}
@keyframes pzzz{0%{opacity:0;transform:translate(-4px,6px)}50%{opacity:1}100%{opacity:0;transform:translate(4px,-8px)}}
.petsvg .e-hap,.petsvg .m-open,.petsvg .m-shut,.petsvg .m-chew,.petsvg .m-yum{display:none}
.petsvg .p-face{transition:transform .15s}
.petbox.eating,.petbox.chew,.petbox.yum{animation:none}
.petbox.eating .p-eyes{--ey:3px;--ex:0px}
.petbox.eating .m-def,.petbox.chew .m-def,.petbox.yum .m-def{display:none}
.petbox.eating .m-open{display:block}
.petbox.eating .p-arm.l{transform:rotate(-55deg) translate(6px,2px)}.petbox.eating .p-arm.r{transform:rotate(55deg) translate(-6px,2px)}
.petbox.eating .petsvg{transition:transform .1s;transform-origin:50% 100%}
.petbox.eating.chomp .petsvg{transform:scale(1.07,.9)}
.petbox.eating.chomp .m-open{display:none}.petbox.eating.chomp .m-shut{display:block}
.petbox.eating.chomp .p-face{transform:translateY(4px)}
.petbox.chew .m-chew{display:block;animation:pchewm .28s linear infinite alternate;transform-origin:50% 50%}
@keyframes pchewm{to{transform:scaleX(.7) translateY(1.5px)}}
.petbox.chew .p-cheek{transform-origin:50% 50%;animation:pchew .28s ease-in-out infinite alternate;opacity:.85}
@keyframes pchew{to{transform:scale(1.5,1.35)}}
.petbox.chew .e-def,.petbox.yum .e-def{display:none}.petbox.chew .e-hap,.petbox.yum .e-hap{display:block}
.petbox.chew .p-all{animation:pchewb .28s ease-in-out infinite alternate}
@keyframes pchewb{to{transform:scale(1.02,.97)}}
.petbox.yum .m-yum{display:block}
.petbox.yum .p-all{animation:pyum .5s cubic-bezier(.2,1.6,.4,1) 2}
@keyframes pyum{40%{transform:translateY(-12px) scale(.96,1.05)}}
.petbox.yum .p-arm.l{transform:rotate(-70deg) translate(-4px,2px)}.petbox.yum .p-arm.r{transform:rotate(70deg) translate(4px,2px)}
.petbox{position:relative}
.pfood{position:absolute;left:50%;top:69%;font-size:34px;line-height:1;transform:translate(-50%,0);pointer-events:none;animation:pfooddrop .55s cubic-bezier(.3,1.4,.5,1);transition:transform .12s;z-index:2}
.petbox.s1 .pfood{font-size:26px}
@keyframes pfooddrop{from{transform:translate(-50%,-150px) rotate(-40deg);opacity:0}}
.pfood.b1{-webkit-mask:radial-gradient(circle at 50% 0%,transparent 30%,#000 31%);mask:radial-gradient(circle at 50% 0%,transparent 30%,#000 31%)}
.pfood.b2{-webkit-mask:radial-gradient(circle at 50% 8%,transparent 46%,#000 47%);mask:radial-gradient(circle at 50% 8%,transparent 46%,#000 47%);transform:translate(-50%,-4px)}
.pfood.b3{-webkit-mask:radial-gradient(circle at 50% 15%,transparent 66%,#000 67%);mask:radial-gradient(circle at 50% 15%,transparent 66%,#000 67%);transform:translate(-50%,-10px)}
.pcrumb{position:absolute;left:50%;top:66%;width:5px;height:5px;border-radius:2px;background:#e9b872;border:1px solid #1a1917;pointer-events:none;animation:pcrumb .5s ease-out forwards;z-index:3}
@keyframes pcrumb{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.hearts{position:absolute;inset:0;pointer-events:none}
.hearts i{position:absolute;top:40%;font-style:normal;color:var(--red);font-size:22px;font-weight:900;animation:heart .9s ease-out forwards}
@keyframes heart{to{transform:translateY(-70px);opacity:0}}
.pbars{display:grid;gap:6px}
.pbars div{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;font-size:12px;font-weight:700}
.pbars .b{height:14px;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden}
.pbars .b i{display:block;height:100%;transition:width .5s}
.pacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pacts .bk{font-size:16px;display:flex;flex-direction:column;gap:3px;align-items:center}
.foods{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-top:8px}
.foods .bk{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;padding:8px 4px}.foods .bk span{font-size:26px;line-height:1}
.poops{position:absolute;left:10px;bottom:6px;display:flex;gap:4px;z-index:2}.poo{font-size:26px;background:none;border:0;padding:2px;cursor:pointer;animation:pop .4s}
.pacts .bk small{font-family:var(--f-body);font-size:11px;font-weight:700;opacity:.8}
.squish{background:#fff;border:var(--bw) solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sqhead{display:flex;justify-content:space-between;align-items:baseline}
.sqhead b{font-family:var(--f-display);font-weight:400;font-size:20px}
.sqhead span{font-size:12px;color:var(--muted);font-weight:700}
.sqstage{position:relative;height:230px;border-radius:12px;background:#f1f4f8;display:grid;place-items:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.sqcount{text-align:center;font-family:var(--f-display);font-size:18px}
.jelly{width:130px;height:130px;border-radius:50%;border:var(--bw) solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff9,#c3c8cf);transition:transform .05s;cursor:pointer}
.ripple{position:absolute;left:50%;top:50%;width:130px;height:130px;margin:-65px;border-radius:50%;border:6px solid;animation:rip .8s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.2);opacity:0}}
.wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px}
.bub{width:44px;height:44px;border-radius:50%;border:2px solid #9aa6b5;background:radial-gradient(circle at 35% 30%,#fff,#dfe8f1);padding:0;box-shadow:inset -3px -4px 0 #c9d4df}
.bub.pop{background:#e6ebf0;box-shadow:none;transform:scale(.8);border-style:dashed}
.mochi{position:relative;width:140px;height:110px;border-radius:50% 50% 46% 46%;background:#fffdf7;border:var(--bw) solid var(--ink);box-shadow:inset 0 -10px 0 #f1ead8;cursor:grab}
.mochi i{position:absolute;top:44px;width:7px;height:7px;border-radius:2px;background:var(--ink)}
.mochi i:first-child{left:46px}.mochi i:last-child{right:46px}
.wxb{position:relative;width:180px;height:180px;cursor:pointer;touch-action:none}
.wxshell{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 6px 0 rgba(26,25,23,.18))}
.wxcore{position:absolute;inset:22px;border-radius:50%;border:var(--bw) solid var(--ink);opacity:0;transition:transform .08s}
.wxcore.on{opacity:1}
.wxsh{position:absolute;left:50%;top:50%;border:1.5px solid var(--ink);pointer-events:none;animation:wxfly .85s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes wxfly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.wxagain{position:absolute;bottom:8px;right:8px;font-size:13px;padding:6px 10px}
.wordc{background:#fff;border:var(--bw) solid var(--ink);border-radius:12px;padding:14px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.wordc b{display:block;font-family:var(--f-display);font-weight:400;font-size:40px;color:var(--sky-d);margin:4px 0}
.wordc span{font-size:14px;font-weight:700}
.skyin input{flex:1;min-width:0;font:inherit;font-size:16px;border:var(--bw) solid var(--ink);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
.skyin .bk{flex:none;font-size:16px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--sky-d);text-decoration:underline;font-weight:700}
.review summary{font-family:var(--f-display);font-size:17px;cursor:pointer}
.qrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--fog)}
.qrow span{font-size:14px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.qrow .bk{font-size:14px;padding:6px 10px}
.fogl{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 40% 18% at 20% 30%,rgba(190,195,202,.75),transparent 70%),
  radial-gradient(ellipse 45% 20% at 75% 55%,rgba(190,195,202,.7),transparent 70%),
  radial-gradient(ellipse 50% 22% at 35% 85%,rgba(190,195,202,.7),transparent 70%);
  animation:drift 14s ease-in-out infinite alternate;transition:opacity 1.2s}
@keyframes drift{to{transform:translateX(6%)}}
.mark{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);font-family:var(--f-display);font-size:16px;display:grid;place-items:center;pointer-events:none;animation:pulse 1.2s ease-in-out infinite;z-index:3}
.mark.done{background:var(--green);color:#fff;animation:none}
@keyframes pulse{50%{transform:scale(1.18)}}
#walker{position:absolute;width:34px;margin-left:-17px;z-index:4;pointer-events:none;transition:left .7s ease, top .7s ease}
#walker svg{width:34px;height:auto;display:block}
#walker.walking svg{animation:hop .18s linear infinite alternate}
@keyframes hop{to{transform:translateY(-4px)}}
#map>.toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;z-index:6;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}

.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));background:var(--ink)}
.dock button{border:3px solid #000;border-radius:10px;padding:6px 0 5px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-display);font-size:13px;color:var(--ink);box-shadow:0 3px 0 #000;background:#fff}
.dock button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.dock svg{width:26px;height:26px}
.dock .d1{background:var(--yellow)} .dock .d2{background:#ffb4a1} .dock .d3{background:#a9dcff} .dock .d4{background:#d9c3ff} .dock .d5{background:#b6f0bf} .dock .d6{background:#ffe08a}

/* ---------- 시트 ---------- */
#sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(26,25,23,.55)}
#sheet .box{background:var(--paper);border-top:var(--bw) solid var(--ink);border-radius:16px 16px 0 0;max-height:92%;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sh-head{display:flex;align-items:center;gap:10px;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:2px dashed var(--fog)}
.sh-head h2{font-size:24px;flex:1;min-width:0}
.sh-head .sub{font-size:12px;color:var(--muted);font-weight:700}
.x{width:40px;height:40px;padding:0;font-size:20px;flex:none}
.sh-body{overflow-y:auto;padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

.npc{display:flex;gap:12px;align-items:flex-end}
.portrait{width:96px;height:96px;flex:none;border:var(--bw) solid var(--ink);border-radius:12px;background:#fbf4e3;overflow:hidden;display:grid;place-items:center}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait.pt-bear{background:var(--red)}.portrait.pt-bear img{object-fit:contain;animation:ptbob 3s ease-in-out infinite}
.portrait.pt-chick{background:var(--paper)}.portrait.pt-chick{place-items:end center}.portrait.pt-chick img{object-fit:contain;width:54%;height:auto;margin-bottom:12%;animation:hop 1.2s ease-in-out infinite}
@keyframes ptbob{50%{transform:translateY(2px) rotate(-1.5deg)}}
.portrait svg{width:78%;height:auto}.portrait svg.cksvg{width:96%}
.portrait.av svg{width:70px;margin-top:22px}
.bubble{position:relative;flex:1;min-width:0;background:#fff;border:var(--bw) solid var(--ink);border-radius:12px;padding:10px 12px 12px;font-size:15px;line-height:1.55;min-height:72px}
.bubble::before{content:"";position:absolute;left:-11px;bottom:14px;border:8px solid transparent;border-right-color:var(--ink)}
.bubble .who{display:block;font-family:var(--f-display);font-size:14px;color:var(--red);margin-bottom:2px}
.bubble .next{position:absolute;right:8px;bottom:4px;font-size:11px;color:var(--muted);animation:pulse 1s infinite}
.speakers{display:flex;gap:8px}
.speakers .bk{flex:1;font-size:15px;padding:8px 6px}
.speakers .bk[aria-pressed="true"]{background:var(--yellow)}
.card{background:#fff;border:var(--bw) solid var(--ink);border-radius:12px;padding:12px 14px}
.card h3{font-size:20px;margin-bottom:6px}
.card p{margin:0;line-height:1.6;font-size:14px}
.label{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.order{background:#1a1917;color:#fff;border-radius:12px;padding:14px;border:var(--bw) solid var(--ink);position:relative}
.order .label{color:var(--yellow)}
.order h3{font-size:24px;margin:4px 0 6px}
.order p{margin:0;font-size:14px;line-height:1.6;opacity:.9}
.order .cls{position:absolute;right:10px;top:10px;transform:rotate(6deg);border:2px solid var(--red);color:var(--red);font-family:var(--f-display);font-size:12px;padding:1px 6px;border-radius:4px}

/* 과제: 사물 찾기 */
.objs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.obj{aspect-ratio:1;border:var(--bw) solid var(--ink);border-radius:10px;background:var(--fog-l);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;box-shadow:0 3px 0 var(--ink);filter:grayscale(1)}
.obj svg{width:46%;height:auto}
.obj.hit{filter:none;background:#fff6c9;animation:pop .4s}
.obj.miss{animation:shake .3s}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* 하늘색 고르기 */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.swatches .sw{aspect-ratio:1.3;border:var(--bw) solid var(--ink);border-radius:10px;box-shadow:0 3px 0 var(--ink)}
.swatches .sw[aria-pressed="true"]{outline:4px solid var(--yellow);outline-offset:2px}

/* 호흡 */
.breath{display:flex;flex-direction:column;align-items:center;gap:12px}
.bfield{position:relative;width:240px;max-width:100%;aspect-ratio:1;border-radius:18px;border:var(--bw) solid var(--ink);overflow:hidden;background:linear-gradient(#bfe3fb,#eaf6ff)}
.bfield .fogc{position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,#b8bdc4 0 30%,transparent 60%),radial-gradient(circle at 70% 60%,#aeb4bc 0 35%,transparent 65%),#c7ccd3;transition:opacity 1.5s}
.borb{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7cf,var(--yellow) 60%,#f2a81d);border:3px solid var(--ink);transform:scale(1);transition:transform 4s ease-in-out}
.bphase{font-family:var(--f-display);font-size:28px}
.bcount{font-size:13px;color:var(--muted);font-weight:700}
.bdots{display:flex;gap:6px}
.bdots i{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);background:#fff}
.bdots i.on{background:var(--green)}

/* 소리 세기 / 천천히 */
.senses{display:grid;gap:8px}
.sense{display:flex;align-items:center;gap:10px;background:#fff;border:var(--bw) solid var(--ink);border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;text-align:left}
.sense i{width:22px;height:22px;border:2px solid var(--ink);border-radius:5px;flex:none;display:grid;place-items:center;font-style:normal}
.sense.on i{background:var(--green);color:#fff}
.sense.wait{opacity:.5}
.tring{width:150px;height:150px;position:relative;margin:0 auto}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:40px;font-weight:400}

/* 조각 획득 */
.got{text-align:center;background:var(--yellow);border:var(--bw) solid var(--ink);border-radius:14px;padding:16px;box-shadow:0 4px 0 var(--ink);animation:pop .5s}
.got .tile{display:inline-grid;place-items:center;width:72px;height:72px;margin:8px 0;background:#fff;border:var(--bw) solid var(--ink);border-radius:10px;font-family:var(--f-display);font-size:44px;box-shadow:0 4px 0 var(--ink)}
.got p{margin:0;font-size:14px;line-height:1.5}

/* 수사보드 */
.board{background:#c69a63;border:var(--bw) solid var(--ink);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background-image:radial-gradient(rgba(0,0,0,.08) 1px,transparent 1.5px);background-size:8px 8px}
.memo{background:#fff9d6;border:2px solid var(--ink);padding:10px 12px;transform:rotate(-1deg);box-shadow:2px 3px 0 rgba(0,0,0,.25)}
.memo .label{color:var(--red)}
.memo h3{font-size:22px;margin:4px 0}
.memo p{margin:0;font-size:13px;line-height:1.5}
.slots,.pool{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot,.ptile{width:56px;height:56px;border:var(--bw) solid var(--ink);border-radius:10px;font-family:var(--f-display);font-size:32px;display:grid;place-items:center;padding:0}
.slot{background:rgba(255,255,255,.55);border-style:dashed}
.slot.f{background:#fff;border-style:solid}
.ptile{background:#fff;box-shadow:0 3px 0 var(--ink)}
.ptile.lock{background:#8d7354;color:transparent;box-shadow:none;border-style:dashed}
.ptile.used{opacity:.25}
.board .cap{font-size:12px;font-weight:700;text-align:center;color:#3c2a14}
.wkline{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wkline div{border:2px solid var(--ink);border-radius:8px;padding:6px 2px;text-align:center;font-size:11px;font-weight:700;background:var(--fog-l);color:var(--muted)}
.wkline div.c{background:var(--green);color:#fff}
.wkline div.n{background:#fff;color:var(--ink);outline:3px solid var(--yellow)}
.wkline b{display:block;font-family:var(--f-display);font-weight:400;font-size:15px}

/* 라디오 */
.radio{background:#2f3b56;border:var(--bw) solid var(--ink);border-radius:14px;padding:14px;color:#fff;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.radio .portrait{width:96px;height:96px}
.radio .t{font-family:var(--f-display);font-size:22px;line-height:1.15}
.radio .a{font-size:13px;opacity:.8;margin-top:2px}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px;margin-top:8px}
.eq i{width:6px;background:var(--yellow);border-radius:2px;animation:eq 1s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}.eq i:nth-child(5){animation-delay:.3s}
@keyframes eq{from{height:4px}to{height:22px}}
a.bk{display:block;text-align:center;text-decoration:none;color:inherit}

/* 날씨 */
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mood{min-width:0;border:var(--bw) solid var(--ink);border-radius:10px;background:#fff;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;box-shadow:0 3px 0 var(--ink)}
.mood svg{width:30px;height:30px}
#mReply{display:flex;flex-direction:column;gap:12px}
#mReply:empty{display:none}
.mood[aria-pressed="true"]{background:var(--yellow)}
.dist{display:grid;gap:6px}
.dist div{display:grid;grid-template-columns:44px 1fr 34px;gap:8px;align-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.dist span.b{height:14px;border:2px solid var(--ink);border-radius:4px;background:#fff;overflow:hidden}
.dist span.b i{display:block;height:100%}

/* 전화 */
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:#fff;border:var(--bw) solid var(--ink);border-radius:12px;padding:12px 14px}
.line h3{font-size:19px}
.line .num{font-family:var(--f-display);font-size:30px;user-select:all;font-variant-numeric:tabular-nums}
.line p{grid-column:1/-1;margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.line .acts{display:flex;gap:6px;grid-row:1/3;grid-column:2}
.line .acts .bk{font-size:14px;padding:8px 10px}
.line.hq{background:var(--yellow)}
.line.hq p{color:var(--ink)}

/* 꾸미기 */
.closet{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
.mirror{background:linear-gradient(#e8edf3,#cdd5df);border:var(--bw) solid var(--ink);border-radius:12px;display:grid;place-items:center;padding:10px 0;position:sticky;top:0}
.mirror svg{width:96px;height:auto}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.tabs button{border:2px solid var(--ink);border-radius:8px;background:#fff;font-family:var(--f-display);font-size:14px;padding:6px 0}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;gap:2px;overflow:hidden}
.opt svg{width:44px;height:auto}
.opt.face svg{width:60px;margin-top:-4px}
.opt[aria-pressed="true"]{background:var(--yellow);box-shadow:0 0 0 2px var(--ink)}
.colors{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.colors button{width:30px;height:30px;border-radius:8px;border:2px solid var(--ink);padding:0}
.colors button[aria-pressed="true"]{outline:3px solid var(--yellow);outline-offset:1px}

.ending img{width:100%;border:var(--bw) solid var(--ink);border-radius:12px}
.mg{--edge:#1a1917;--panel:#ffffff;--stage:#d9dde2;--stage-ink:#1a1917;--fog-soft:#c9cdd2;--sun:#ffc93a;--coral:#ff7564;--grape:#9b82f5;--mint:#3cc6b4;--line:#cfd6de;--bg:#e9edf1;--muted:#5c6878;--display:var(--f-display);--body:var(--f-body);--mono:ui-monospace,Menlo,Consolas,monospace;font-family:var(--f-body)}
.mg *{box-sizing:border-box}
.mg p{margin:0}
.mg h3{font-family:var(--f-display);font-weight:400;margin:0;font-size:19px}
.mg .stage{position:relative;background:var(--stage);color:var(--stage-ink);border:3px solid var(--edge);border-radius:18px;box-shadow:0 4px 0 var(--edge);min-height:470px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden;user-select:none;-webkit-user-select:none;width:100%}
.mg .done .blk{margin-top:4px}
.mg .blk{border:3px solid var(--edge);border-radius:10px;background:var(--panel);box-shadow:0 4px 0 var(--edge);padding:9px 16px;font-family:var(--display);font-size:17px;line-height:1.2;transition:transform .08s,box-shadow .08s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.mg .blk:active,.mg .blk.down{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.mg .blk.go{background:var(--sun);color:#1c2330}
.mg .blk.sky{background:var(--sky);color:#fff}
.mg .blk:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--edge)}
.mg .stage .hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.mg .stage .hud b{font-family:var(--display);font-weight:400;font-size:18px}
.mg .chip{font-family:var(--mono);font-size:11.5px;background:var(--panel);border:2px solid var(--edge);border-radius:6px;padding:1px 7px;white-space:nowrap}
.mg .guide{font-family:var(--display);font-size:20px;text-align:center;min-height:2.6em;display:flex;align-items:center;justify-content:center;line-height:1.3}
.mg .sub{font-size:13.5px;text-align:center;color:var(--muted)}
.mg .grow{flex:1}
.mg .grid{display:grid;gap:2px}
.mg .cell{aspect-ratio:1;border-radius:3px;background:var(--fog);transition:background-color .5s, transform .3s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.mg .done{position:absolute;inset:0;background:color-mix(in srgb,var(--stage) 88%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;z-index:5;animation:mgfade .4s ease}
.mg .done .gem{width:58px;height:58px;border:4px solid var(--edge);border-radius:10px;box-shadow:0 5px 0 var(--edge);transform:rotate(8deg)}

<script>
/* ===== 미니게임 6종 (미니게임 시안에서 가져옴) ===== */
const MG=(()=>{
const IMG={base:"img/ng-base.jpg",agent:"img/neulgom-head.webp",yawn:"img/ng-yawn.jpg"};
const C={sky:"#4aa8f0",grass:"#4cbf62",sun:"#ffc93a",coral:"#ff7564",grape:"#9b82f5",mint:"#3cc6b4"};
const $=(s,r=document)=>r.querySelector(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function rnd(a,b){return a+Math.random()*(b-a)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hex(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function mix(a,b,t){const x=hex(a),y=hex(b);return`rgb(${x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(',')})`}
function fogColor(){return getComputedStyle(document.documentElement).getPropertyValue('--fog').trim()||'#a7acb3'}
function finish(stage,g,{title,msg,img,extra}){
  const o=el('div','done');
  o.innerHTML=(img?`<img src="${img}" alt="늘곰">`:'')+`<div class="gem" style="background:${g.color}"></div><h3>${title}</h3><p>${msg}</p><span class="chip">${g.doneLabel||'색 조각 획득 · '+g.colorName}</span>`;
  if(extra)o.appendChild(extra);
  const go=el('button','blk go',g.doneBtn||'조각 받기');go.onclick=()=>g.onDone&&g.onDone();o.appendChild(go);
  stage.appendChild(o);
}
/* ---------- A. 안개 걷기 호흡 ---------- */
function breath(stage,g){
  const ROWS=7,COLS=9,TOTAL=3;let breaths=0,state='idle',t0=0,raf=0,cleared=0;
  stage.innerHTML=`<div class="hud"><b>안개 걷기 호흡</b><span class="chip" id="cnt">호흡 0 / ${TOTAL}</span></div>
  <div class="sky"><div class="grid" id="g" style="grid-template-columns:repeat(${COLS},1fr)"></div><div class="sun" id="sun"></div></div>
  <div class="orbwrap"><div class="orb" id="orb"></div></div>
  <p class="guide" id="gd">버튼을 꾹 누르는 동안 숨을 들이쉬어요</p>
  <button class="blk go hold" id="hold">꾹 누르고 들이쉬기</button>`;
  const grid=$('#g',stage),cells=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=el('div','cell');x.dataset.r=r;x.style.background=r>4?mix('#cfd3d8',fogColor(),.3):fogColor();grid.appendChild(x);cells.push(x)}
  const orb=$('#orb',stage),gd=$('#gd',stage),btn=$('#hold',stage);
  const IN=4000,OUT=5000;
  function skyColor(r,c){if(r>=5)return r==5?C.grass:'#3e9b50';return mix('#bfe4ff',C.sky,r/5)}
  function loop(){const now=performance.now();
    if(state==='in'){const p=Math.min(1,(now-t0)/IN);orb.style.transform=`scale(${.45+.55*p}) rotate(${p*45}deg)`;
      gd.textContent=p<1?`들이쉬기… ${Math.min(4,Math.floor((now-t0)/1000)+1)}`:'이제 손을 떼고 내쉬어요'}
    else if(state==='out'){const p=Math.min(1,(now-t0)/OUT);orb.style.transform=`scale(${1-.55*p}) rotate(${45-p*45}deg)`;
      gd.textContent=`후우… 내쉬기 ${Math.min(5,Math.floor((now-t0)/1000)+1)}`;
      const target=Math.round(ROWS*(breaths+p)/TOTAL);
      while(cleared<target){const r=cleared;cells.filter(x=>+x.dataset.r===r).forEach((x,i)=>setTimeout(()=>x.style.background=skyColor(r,i),i*40));cleared++}
      if(p>=1){breaths++;$('#cnt',stage).textContent=`호흡 ${breaths} / ${TOTAL}`;state='idle';
        if(breaths>=TOTAL){$('#sun',stage).style.transform='scale(1)';btn.disabled=true;
          setTimeout(()=>finish(stage,g,{title:'하늘색을 되찾았어',msg:'숨을 길게 내쉬는 동안 몸이 조금 느슨해졌을 거야. 지금 진짜 하늘도 한 번 올려다봐.'}),900);return}
        gd.textContent='잘했어요. 버튼을 다시 누르고 숨을 들이쉬어요'}}
    raf=requestAnimationFrame(loop)}
  function down(e){e.preventDefault();if(state!=='idle')return;state='in';t0=performance.now();btn.classList.add('down')}
  function up(){btn.classList.remove('down');if(state!=='in')return;const d=performance.now()-t0;
    if(d<2500){state='idle';orb.style.transform='scale(.45)';gd.textContent='조금만 더 길게, 4초 동안 들이쉬어 볼까?';stage.querySelector('.orbwrap').classList.add('shake');setTimeout(()=>stage.querySelector('.orbwrap')?.classList.remove('shake'),500);return}
    state='out';t0=performance.now()}
  btn.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(t=>btn.addEventListener(t,up));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  raf=requestAnimationFrame(loop);
  return()=>cancelAnimationFrame(raf);
}

/* ---------- B. 마음돌 닦기 ---------- */
function stone(stage,g){
  const N=13,R=5.8;let color=C.mint,cells=[],vals=[],last=null,warnT=0,doneFlag=false;
  stage.innerHTML=`<div class="hud"><b>마음돌 닦기</b><span class="chip" id="pc">0%</span></div>
  <p class="sub">돌 색을 고르고, 손가락으로 살살 문질러 닦아요.</p>
  <div class="palette" id="pal"></div>
  <div class="grow" style="display:flex;align-items:center"><div class="stone" id="st"><div class="grid" id="g" style="grid-template-columns:repeat(${N},1fr)"></div></div></div>
  <div class="bar"><i id="bar"></i></div>
  <p class="guide" id="gd">회색 돌이 하나 있어요</p>`;
  const pal=$('#pal',stage);[['하늘',C.sky],['민트',C.mint],['노을',C.coral]].forEach(([n,c],i)=>{const b=el('button','blk',`<span class="sw" style="background:${c}"></span>${n}`);b.setAttribute('aria-pressed',i==1);b.onclick=()=>{color=c;pal.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));paint()};pal.appendChild(b)});
  const grid=$('#g',stage),st=$('#st',stage),gd=$('#gd',stage);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const dx=(c-6)/1.0,dy=(r-6)/0.82;const inside=Math.hypot(dx,dy)<R;const x=el('div','cell'+(inside?'':' off'));grid.appendChild(x);cells.push(inside?x:null);vals.push(inside?0:-1)}
  const total=vals.filter(v=>v>=0).length;
  function paint(){const f=fogColor();cells.forEach((x,i)=>{if(x)x.style.background=mix(f,color,Math.min(1,vals[i]))})}
  paint();
  function rub(e){if(doneFlag)return;const rect=grid.getBoundingClientRect();const x=e.clientX-rect.left,y=e.clientY-rect.top;const now=performance.now();
    if(last){const dist=Math.hypot(x-last.x,y-last.y),dt=Math.max(1,now-last.t),speed=dist/dt;
      if(speed>1.5){if(now-warnT>600){gd.textContent='살살 문질러 닦아야지';warnT=now}}
      else{const cw=rect.width/N;const cc=Math.floor(x/cw),rr=Math.floor(y/cw);const gain=dist/cw*0.09;
        for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const r2=rr+a,c2=cc+b;if(r2<0||c2<0||r2>=N||c2>=N)continue;const k=r2*N+c2;if(vals[k]<0)continue;vals[k]=Math.min(1,vals[k]+gain*(a||b?.5:1))}
        if(now-warnT>900)gd.textContent='딱 좋은 속도. 돌이 반짝이기 시작한다';paint()}}
    last={x,y,t:now};
    const pct=Math.round(vals.filter(v=>v>=.85).length/total*100);$('#pc',stage).textContent=pct+'%';$('#bar',stage).style.width=pct+'%';
    if(pct>=88&&!doneFlag){doneFlag=true;vals=vals.map(v=>v<0?v:1);paint();
      const box=el('div','word');box.innerHTML='<input id="worryword" maxlength="12" placeholder="걱정 한 단어 (저장 안 됨)" aria-label="이 돌에 맡길 걱정 한 단어"><button class="blk">맡기기</button>';
      box.querySelector('button').onclick=()=>{const v=box.querySelector('input').value.trim();box.outerHTML=`<p class="chip">${v?'"'+v.replace(/[<>&]/g,'')+'"':'말하지 않은 걱정'}은 마음돌이 맡아 둘게</p>`};
      setTimeout(()=>finish(stage,g,{title:'마음돌 완성',msg:'걱정이 많을 때 돌 닦기처럼 손으로 한 가지 일에 집중하면 생각이 차분해져. 진짜 돌이나 키링으로도 해 봐.',extra:box}),400)}}
  st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);last=null;rub(e)});
  st.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')rub(e)});
  st.addEventListener('pointerup',()=>last=null);
  return()=>{};
}

/* ---------- C. 멍때리기 ---------- */
function meong(stage,g){
  let dur=30,running=false,t0=0,raf=0,timers=[];
  stage.innerHTML=`<div class="hud"><b>멍 지키기</b><span class="chip">화면을 건드리지 않기</span></div>
  <div class="meong" id="m"><div class="ring"><svg viewBox="0 0 210 210"><circle cx="105" cy="105" r="96" fill="none" stroke="var(--fog-soft)" stroke-width="12"/><circle id="arc" cx="105" cy="105" r="96" fill="none" stroke="${C.grape}" stroke-width="12" stroke-dasharray="603.2" stroke-dashoffset="603.2" stroke-linecap="butt"/></svg><img id="bear" src="${IMG.base}" alt="멍때리는 늘곰"><span class="t" id="t">${dur}</span></div>
  <p class="guide" id="gd">늘곰처럼 아무것도 안 하기</p></div>
  <div class="seg" id="seg"></div>
  <button class="blk go" id="go" style="width:100%;padding:14px">시작하고 손 떼기</button>`;
  const m=$('#m',stage),arc=$('#arc',stage),gd=$('#gd',stage),go=$('#go',stage),seg=$('#seg',stage),bear=$('#bear',stage);
  [30,60].forEach(s=>{const b=el('button','blk',s+'초');b.setAttribute('aria-pressed',s===dur);b.onclick=()=>{if(running)return;dur=s;$('#t',stage).textContent=s;seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};seg.appendChild(b)});
  const bait=[['새 메시지 3개','지금 확인하지 않으면 사라져요!'],['친구가 좋아요를 눌렀어요','누가 눌렀는지 볼까요?'],['급식 메뉴 업데이트','오늘 디저트는…?']];
  function fail(why){if(!running)return;running=false;cancelAnimationFrame(raf);timers.forEach(clearTimeout);stage.querySelector('.toast')?.remove();
    m.classList.add('shake');setTimeout(()=>m.classList.remove('shake'),500);gd.textContent=why+' 괜찮아, 다시 멍~';go.hidden=false;seg.hidden=false;arc.style.strokeDashoffset=603.2;bear.style.filter='';m.style.background=''}
  function loop(){const p=Math.min(1,(performance.now()-t0)/(dur*1000));arc.style.strokeDashoffset=603.2*(1-p);$('#t',stage).textContent=Math.ceil(dur*(1-p));
    bear.style.filter=`grayscale(${1-p})`;m.style.background=`color-mix(in srgb, ${C.grape} ${Math.round(p*28)}%, transparent)`;
    if(p>=1){running=false;timers.forEach(clearTimeout);stage.querySelector('.toast')?.remove();finish(stage,g,{img:IMG.yawn,title:'멍 성공',msg:`${dur}초 동안 아무것도 안 했어. 뇌도 쉬는 시간이 필요해. 하품이 나오면 그것도 성공이야.`});return}
    raf=requestAnimationFrame(loop)}
  go.onclick=()=>{go.hidden=true;seg.hidden=true;gd.textContent='3';let n=3;const tick=()=>{n--;if(n>0){gd.textContent=n;timers.push(setTimeout(tick,700))}else{gd.textContent='멍…';running=true;t0=performance.now();raf=requestAnimationFrame(loop);
      [.3,.62].forEach((f,i)=>timers.push(setTimeout(()=>{if(!running)return;const [a,b]=bait[(i+Math.floor(Math.random()*3))%3];const t=el('div','toast',`<span class="dot"></span><span><b>${a}</b>${b}</span>`);m.appendChild(t);timers.push(setTimeout(()=>t.remove(),3200))},dur*1000*f)))}};timers.push(setTimeout(tick,700))};
  const onDown=e=>{if(running){e.preventDefault();fail(e.target.closest('.toast')?'앗, 알림에 넘어갔다!':'앗, 손이 움직였어.')}};
  stage.addEventListener('pointerdown',onDown);
  const vis=()=>{if(document.hidden)fail('다른 앱으로 갔다 왔네.')};document.addEventListener('visibilitychange',vis);
  return()=>{running=false;cancelAnimationFrame(raf);timers.forEach(clearTimeout);document.removeEventListener('visibilitychange',vis)};
}

/* ---------- D. 안개 몬스터 이름 붙이기 ---------- */

    const ws=$('#ws',stage);shuffle(R.w).forEach(w=>{const b=el('button','blk',w);b.setAttribute('aria-pressed','false');b.onclick=()=>{
      if(picked.includes(w))picked=picked.filter(x=>x!==w);else{if(picked.length>=2)picked.shift();picked.push(w)}

    const sz=$('#sz',stage);[1,2,3,4,5].forEach(n=>{const b=el('button');b.style.width=b.style.height=(14+n*7)+'px';b.setAttribute('aria-label',`크기 ${n}`);b.setAttribute('aria-pressed','false');b.onclick=()=>{size=n;sz.querySelectorAll('button').forEach((x,i)=>x.setAttribute('aria-pressed',i<n));$('#mon',stage).style.transform=`scale(${.7+n*.12})`;check()};sz.appendChild(b)});

/* ---------- E. 오감 수색 ---------- */
function senses(stage,g){
  const COLS=7,ROWS=9;const S=[
    ['눈','보이는 것','지금 주변에서 파란색 물건을 하나 찾아 봐.','찾았어'],
    ['귀','들리는 것','3초만 눈을 감아. 가장 멀리서 들리는 소리는 뭐야?','들었어'],
    ['코','냄새','숨을 천천히 들이쉬어. 교실에서 어떤 냄새가 나?','맡았어'],
    ['손','닿는 것','책상이나 옷을 손끝으로 쓸어 봐. 차가워, 따뜻해?','느꼈어'],
    ['입','맛','침을 한 번 꿀꺽. 입 안에 남은 맛이 있어?','확인했어']];
  let found=0,taps=0,busy=false;
  stage.innerHTML=`<div class="hud"><b>오감 수색</b><span class="chip" id="fc">감각 조각 0 / 5</span></div>
  <p class="sub">안개 낀 복도 어딘가에 감각 조각 5개가 숨어 있어. 블록을 눌러 비춰 봐.</p>
  <div class="grid hunt" id="g" style="grid-template-columns:repeat(${COLS},1fr)"></div>
  <p class="guide" id="gd" style="font-size:17px">탐색 0번</p>`;
  const grid=$('#g',stage),cells=[],gd=$('#gd',stage);
  function sceneColor(r,c){if(r<2)return(c==1||c==2||c==4||c==5)?'#9fd4ff':'#f3e3b8';if(r<4)return c%3==0?'#f3e3b8':(r==2?'#6cc07b':'#5aa86a');if(r<6)return c==3?'#c9a0ff':'#f3e3b8';return(r+c)%2?'#d9a36b':'#c78f58'}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=el('div','cell');x.style.background=fogColor();x.dataset.r=r;x.dataset.c=c;grid.appendChild(x);cells.push(x)}
  const spots=[];while(spots.length<5){const k=Math.floor(Math.random()*cells.length);const r=Math.floor(k/COLS),c=k%COLS;if(spots.every(s=>Math.abs(s.r-r)+Math.abs(s.c-c)>2))spots.push({k,r,c,s:S[spots.length],found:false})}
  function lit(r,c){cells[r*COLS+c].style.background=sceneColor(r,c);cells[r*COLS+c].dataset.lit=1}
  grid.addEventListener('click',e=>{const x=e.target.closest('.cell');if(!x||busy)return;const r=+x.dataset.r,c=+x.dataset.c;
    const sp=spots.find(s=>s.k===r*COLS+c&&s.found&&!s.done);if(sp){ask(sp);return}
    taps++;gd.textContent=`탐색 ${taps}번`;
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const rr=r+a,cc=c+b;if(rr<0||cc<0||rr>=ROWS||cc>=COLS)continue;lit(rr,cc)}
    spots.forEach(s=>{if(!s.found&&Math.abs(s.r-r)<=1&&Math.abs(s.c-c)<=1){s.found=true;const t=cells[s.k];t.dataset.s=s.s[0];t.classList.add('found');gd.textContent=`'${s.s[0]}' 조각 발견! 눌러서 지령 확인`}})});
  function ask(sp){busy=true;const [k,name,q,ok]=sp.s;const p=el('div','prompt',`<span class="chip" style="align-self:flex-start">${k} · ${name}</span><b>${q}</b>`);
    const b=el('button','blk go',ok);b.style.padding='12px';b.onclick=()=>{p.remove();busy=false;sp.done=true;cells[sp.k].classList.add('done');found++;$('#fc',stage).textContent=`감각 조각 ${found} / 5`;
      gd.textContent=found<5?'좋아, 다음 조각을 찾아 봐':'복도에 색이 돌아왔어';
      if(found>=5){cells.forEach((x,i)=>setTimeout(()=>lit(+x.dataset.r,+x.dataset.c),i*15));setTimeout(()=>finish(stage,g,{title:'오감이 깨어났어',msg:`탐색 ${taps}번 만에 다섯 감각을 모두 깨웠어. 불안할 때 '보이는 것, 들리는 것, 닿는 것'을 하나씩 세어 보면 지금 여기로 돌아올 수 있어.`}),1300)}};
    p.appendChild(b);stage.appendChild(p)}
  return()=>{};
}

/* ---------- F. 평범하게 걷기 ---------- */
function walk(stage,g){
  const STEPS=12;let pos=0,lastT=0,lastFoot=null,beatT=0,beatOn=false,raf=0;const BEAT=1100;
  stage.innerHTML=`<div class="hud"><b>평범하게 걷기</b><span class="chip" id="pc">0 / ${STEPS}걸음</span></div>
  <p class="sub">감시 카메라를 지나 Wee클래스까지. 너무 빨리 걸으면 수상해 보여. 발바닥이 바닥에 닿는 느낌에 집중해.</p>
  <div class="grid path" id="g" style="grid-template-columns:repeat(6,1fr);gap:4px"></div>
  <div class="beat" id="bt" title="걸음 박자"></div>
  <p class="guide" id="gd">네모가 반짝일 때 한 걸음씩</p>
  <div class="grow"></div>
  <div class="feet"><button class="blk" id="L">왼발</button><button class="blk" id="R">오른발</button></div>`;
  const grid=$('#g',stage),gd=$('#gd',stage),cells=[];
  const order=[0,1,2,3,4,5,11,10,9,8,7,6];
  for(let i=0;i<12;i++){const x=el('div','cell');x.style.background=fogColor();grid.appendChild(x);cells.push(x)}
  cells[order[STEPS-1]].classList.add('door');cells[order[STEPS-1]].innerHTML='';
  const me=el('div','me');me.style.backgroundImage=`url(${IMG.agent})`;cells[order[0]].appendChild(me);
  function loop(t){const on=(t%BEAT)<160;if(on!==beatOn){beatOn=on;$('#bt',stage).classList.toggle('on',on)}raf=requestAnimationFrame(loop)}
  raf=requestAnimationFrame(loop);
  function step(f){const now=performance.now();const dt=now-lastT;
    if(lastFoot===f){gd.textContent='같은 발로 두 번? 왼발, 오른발 번갈아';stage.querySelector('.feet').classList.add('shake');setTimeout(()=>stage.querySelector('.feet')?.classList.remove('shake'),500);return}
    if(lastFoot&&dt<650){gd.textContent='너무 서두르면 들켜! 천천히';lastT=now;lastFoot=f;cells[order[pos]].style.outline='3px solid '+C.coral;setTimeout(()=>cells[order[pos]]&&(cells[order[pos]].style.outline=''),400);return}
    if(lastFoot&&dt>2600){gd.textContent='너무 멈췄어. 자연스럽게 다시 한 걸음';lastT=now;lastFoot=f;return}
    lastT=now;lastFoot=f;cells[order[pos]].classList.add('ok');pos++;if(pos>=STEPS-1){cells[order[STEPS-1]].classList.add('ok');pos=STEPS}$('#pc',stage).textContent=`${pos} / ${STEPS}걸음`;
    if(pos<STEPS){cells[order[pos]].appendChild(me);gd.textContent=['쿵… 뒤꿈치','발바닥 전체','발가락 끝','자연스러워'][pos%4]}
    if(pos>=STEPS){cells[order[STEPS-1]].appendChild(me);cancelAnimationFrame(raf);$('#L',stage).disabled=$('#R',stage).disabled=true;
      setTimeout(()=>finish(stage,g,{img:IMG.agent,title:'Wee클래스 도착',msg:'아무도 눈치채지 못했어. 천천히 걸으면 발바닥, 숨, 주변 소리가 같이 느껴져. 오늘 복도에서 한 번 해 봐.'}),600)}}
  $('#L',stage).onclick=()=>step('L');$('#R',stage).onclick=()=>step('R');
  return()=>cancelAnimationFrame(raf);
}

  }
  h+=`<div class="fogl" id="fogl"></div><div id="marks"></div><div id="walker">${avatarSVG(S.av)}</div>`;
  m.innerHTML=h;
  m.querySelectorAll('.room').forEach(b=>b.onclick=()=>{ const k=b.dataset.loc; if(!locOpen(k)) return toast(`${LOCS[k].name}은(는) ${LOCS[k].open}주차에 안개가 걷혀요`); walkTo(k); });

function locCenter(k){ const L=LOCS[k]; return {x:L.x+L.w/2+(L.y<70?1:0), y:L.y+L.h}; }
function placeWalker(k,anim=true){
  const w=$('#walker'), c=locCenter(k);

}
let walking=false;
function walkTo(k){
  if(walking) return; walking=true;

}
function refresh(){
  const n=litCount(), p=n/LIT_MAX;
  const lit=new Set(LIT_ORDER.slice(0,n));
  document.querySelectorAll('#map [data-lit]').forEach(e=>e.classList.toggle('lit',lit.has(e.dataset.lit)));
  $('#fogl').style.opacity = (1-p)*0.9+0.05;
  $('#hudBar').style.width=Math.round(p*100)+'%';
  const w=W(), wd=weekDay();
  $('#hudWeek').textContent=`${w.n}주차 · ${w.title} · 색 ${n}/${LIT_MAX}`;
  $('#hudRank').innerHTML=SpyPlus.rankHTML();
  $('#hudPieces').textContent=`${piecesOf(w.n)}/${w.spots.length}`;
  $('#hudMe').innerHTML=avatarSVG(S.av);
  $('#walker').innerHTML=avatarSVG(S.av);
  // 단서 마커: 오늘 밤 찾을 조각 한 곳에만 느낌표
  let mk=''; const ti=tonightSpot();
  w.spots.forEach((s,i)=>{ const L=LOCS[s.loc]; const done=S.got[gotKey(w.n,i)];
    if(done) mk+=`<span class="mark done" style="left:${L.x+L.w-3}%;top:${L.y+1}%">✓</span>`;
    else if(i===ti) mk+=`<span class="mark" style="left:${L.x+L.w-3}%;top:${L.y+1}%">!</span>`; });
  if(!S.cleared[w.n] && piecesOf(w.n)===w.spots.length && decodeOpen()){ const L=LOCS.hq; mk+=`<span class="mark" style="left:${L.x+L.w-3}%;top:${L.y+1}%">★</span>`; }
  $('#marks').innerHTML=mk;
  drawTodayBar();
}

function portraitHTML(k){

  if(k==='chick') return `<div class="portrait pt-chick"><img src="img/chick.webp" alt="병아리 요원"></div>`;
  if(k==='native') return `<div class="portrait av" style="background:#dff0ff">${avatarSVG(NATIVE.av)}</div>`;

function talk(host,who,lines,done){
  let i=0;
  host.innerHTML=`<div class="npc">${portraitHTML(who.k)}<div class="bubble" role="button" tabindex="0"><span class="who">${who.name}</span><span class="txt"></span><span class="next">▼ 터치</span></div></div>`;
  const b=host.querySelector('.bubble'), t=host.querySelector('.txt'), nx=host.querySelector('.next');
  let typing=null;
  const show=()=>{ const s=lines[i]; let j=0; t.textContent=''; clearInterval(typing);
    typing=setInterval(()=>{ t.textContent=s.slice(0,++j); if(j>=s.length){clearInterval(typing);typing=null;} },28); timers.push(typing);
    nx.hidden = i>=lines.length-1; if(i>=lines.length-1 && done) done(); };
  const adv=()=>{ if(typing){clearInterval(typing);typing=null;t.textContent=lines[i];return;} if(i<lines.length-1){i++;show();} };
  b.onclick=adv; b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();adv();}};
  show();
}

function isOrderDay(dt){ const k=dkey(dt), g=dt.getDay(); return k>=OP_FIRST && k<=OP_LAST && g>=1 && g<=5; }
function orderIdx(dt){ return Math.floor(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())/864e5)%ORDERS.length; }

function bpN(){ const tk=today()+''; return S.bp&&S.bp.d===tk ? S.bp.n : 0; }
function setBp(n){ const tk=today()+''; if(bpN()<n){ S.bp={d:tk,n}; save(); } }
function nextHint(){
  const wd=weekDay(), last=S.week===WEEKS.length, tmk=dkey(addDays(NOW(),1))+'';
  const o=S.orders[tmk]!=null ? `내일 지령 「${ORDERS[S.orders[tmk]][0]}」 · ` : '';
  let h;
  if(wd===0) h='작전은 11월 16일 월요일 저녁에 시작돼요';
  else if(wd>=8 || (last&&S.finale)) h='작전 끝. 3주 동안 고생했어요';
  else if(wd<=2) h=`내일 밤 ${['','두 번째','세 번째'][wd]} 조각이 열려요`;
  else if(wd===3) h='내일 밤 암호 해독';
  else if(wd===4) h=last?'내일 밤 최종 작전':'내일 밤 주간 결산';
  else if(wd===5) h=last?'최종 작전이 열려 있어요':'주말엔 쉬어도 돼요. 월요일 지령은 일요일 밤에';
  else if(wd===6) h='월요일 지령은 내일 밤에 받아요';
  else h=last?'작전 끝. 3주 동안 고생했어요':'내일 밤 다음 주 작전 시작';
  return o+h;
}
function drawTodayBar(){

function openBrief(){

    <div class="bsteps" id="bSteps"></div>

    // 1. 오늘 지령 보고 (어제 저녁에 받은 지령)

      if(!cleared){ const ni=w.spots.findIndex((s,i)=>!S.got[gotKey(w.n,i)]);

function openLoc(k){

  if(k==='fog') return openFog();
  if(k==='principal') return openPrincipal();
  const L=LOCS[k], w=W();
  const si=w.spots.findIndex(s=>s.loc===k), spot=w.spots[si];
  const got = si>=0 && S.got[gotKey(w.n,si)];
  sheet(L.name, L.sub+' · '+L.npc, `<div id="talkHost"></div><div id="task"></div>
    <p class="note">학교에서는 휴대폰 없이 눈과 귀로 해 보고, 이 화면은 집에서 저녁에 열어서 이어 가요.</p>`, body=>{
    const host=body.querySelector('#talkHost'), task=body.querySelector('#task');
    const who={k, name:L.npc}; const v=visit(k+'-'+w.n);

function breathe(host,cycles,done,free){
  host.innerHTML=`<div class="breath">
    <div class="bfield"><div class="fogc" id="fogc"></div><div class="borb" id="orb"></div></div>
    <div class="bphase" id="bph">준비</div>

    <div class="bcount" id="bcnt">들이쉬기 4초 · 멈춤 2초 · 내쉬기 6초</div>
    <button class="bk sky wide" id="bGo">시작하기</button></div>`;
  const orb=host.querySelector('#orb'), ph=host.querySelector('#bph'), fog=host.querySelector('#fogc'), dots=[...host.querySelectorAll('.bdots i')], cnt=host.querySelector('#bcnt');
  host.querySelector('#bGo').onclick=e=>{ e.target.hidden=true; let c=0;
    const cyc=()=>{
      ph.textContent='들이쉬기'; orb.style.transitionDuration='4s'; orb.style.transform='scale(2.6)'; count(4);
      timers.push(setTimeout(()=>{ ph.textContent='잠깐 멈춤'; count(2);
        timers.push(setTimeout(()=>{ ph.textContent='내쉬기'; orb.style.transitionDuration='6s'; orb.style.transform='scale(1)'; count(6);
          timers.push(setTimeout(()=>{ dots[c].classList.add('on'); c++; fog.style.opacity=Math.max(0,1-c/cycles);
            if(c<cycles) cyc(); else { ph.textContent='안개 정화 완료'; cnt.textContent='잘했어요. 지금 숨이 어떤지 잠깐 살펴봐요.'; if(done) timers.push(setTimeout(done,900)); else { const b=document.createElement('button'); b.className='bk sky wide'; b.textContent='한 번 더'; b.onclick=()=>breathe(host,cycles,null,true); host.querySelector('.breath').appendChild(b);} }
          },6000)); },2000)); },4000));

function openBoard(){
  const w=W(); const cleared=!!S.cleared[w.n];
  const letters=w.spots.map((s,i)=>({ch:s.piece,got:!!S.got[gotKey(w.n,i)],i}));
  const pool=[...letters].sort((a,b)=>((a.ch.charCodeAt(0)*7)%5)-((b.ch.charCodeAt(0)*7)%5));
  sheet('수사보드',`${w.n}주차 · ${w.dates}`,`
    <div class="board">
      <div class="memo"><div class="label">금주의 표어</div><h3>“${w.motto}”</h3><p>사건: ${w.title} · 감각: ${w.sense}</p></div>
      <div class="memo" style="transform:rotate(1deg);background:#fff"><div class="label">암호 단서</div><p style="font-size:14px;font-weight:700">${w.clue}</p></div>
      <div class="slots" id="slots">${letters.map(()=>'<div class="slot"></div>').join('')}</div>
      <div class="pool" id="pool">${pool.map(l=>`<button class="ptile ${l.got?'':'lock'}" data-ch="${l.ch}" ${l.got&&decodeOpen()?'':'disabled'} aria-label="${l.got?l.ch:'아직 못 찾은 조각'}">${l.got?l.ch:'?'}</button>`).join('')}</div>
      <div class="cap" id="bcap">${cleared?'해독 완료!':'조각을 눌러 단서에 맞는 순서로 놓아요.'}</div>
    </div>
    <div class="row"><button class="bk" id="bReset">다시 놓기</button></div>
    <div><div class="label" style="margin-bottom:6px">작전 일지</div>
      <div class="wkline">${WEEKS.map(x=>`<div class="${S.cleared[x.n]?'c':x.n===w.n?'n':''}"><b>${x.n}주</b>${x.sense}</div>`).join('')}</div>
      <div class="badges" style="margin-top:8px">${[['office','교무실 위장 통과'],['principal','교장실 소파 멍'],['emotion','감정 도감']].map(([k,n])=>`<span class="${(S.badges||{})[k]?'on':''}">${(S.badges||{})[k]?'★ ':''}${n}</span>`).join('')}</div></div>
    <div id="clearMsg"></div>
    ${(DEMO||HQ.on)?`<div><div class="label" style="margin-bottom:6px">전교 정화 작전${HQ.cached()?'':' (시연용 예시 숫자)'}</div><div id="raidHost"></div></div>`:""}
  `, body=>{
    if(DEMO||HQ.on){ const rd=SpyPlus.mountRaid(body.querySelector('#raidHost'),Object.assign(raidNums(),{week:w.n+'주차', name:'회색 거인'}));
    mgStop=rd.stop; raidSet=rd.set; HQ.state(true).then(st=>{ if(st&&raidSet===rd.set){ raidLocal=0; rd.set(raidNums()); } }); }
    const slots=[...body.querySelectorAll('.slot')], tiles=[...body.querySelectorAll('.ptile')];
    let seq=[];
    const draw=()=>{ slots.forEach((s,i)=>{ s.textContent=seq[i]?seq[i].ch:''; s.classList.toggle('f',!!seq[i]); }); tiles.forEach(t=>t.classList.toggle('used',seq.some(q=>q.el===t))); };
    if(cleared){ seq=w.word.split('').map(ch=>({ch,el:null})); draw(); tiles.forEach(t=>t.classList.add('used')); return; }
    tiles.forEach(t=>t.onclick=()=>{ if(!decodeOpen()||seq.some(q=>q.el===t)||seq.length>=slots.length) return; seq.push({ch:t.dataset.ch,el:t}); draw();
      if(seq.length===slots.length){ const guess=seq.map(q=>q.ch).join('');
        if(guess===w.word){ if(!S.cleared[w.n]) HQ.add('decode'); S.cleared[w.n]=true; save(); SpyPlus.addXP(50,'주간 작전 성공'); body.querySelector('#bcap').textContent='해독 완료!'; clearWeek(body.querySelector('#clearMsg'),w); }
        else { body.querySelector('#bcap').textContent=`「${guess}」…? 단서를 다시 읽어 봐요.`; setTimeout(()=>{seq=[];draw();},900); } } });
    body.querySelector('#bReset').onclick=()=>{ seq=[]; draw(); };
    if(letters.some(l=>!l.got)) body.querySelector('#bcap').textContent=`아직 못 찾은 조각이 ${letters.filter(l=>!l.got).length}개 있어요. 조각은 월·화·수 밤에 하나씩 열려요.`;

  });
}

  const d=new Date(); const hs=(HQ.cached()||{}).song; const s=(hs&&hs.t)?{t:hs.t.replace(/[<>&]/g,''),a:(hs.a||'').replace(/[<>&]/g,''),note:(hs.note||'오늘 본부 추천곡이다.').replace(/[<>&]/g,'')}:SONGS[(d.getDay()+4)%SONGS.length];
  sheet('본부 라디오','오늘의 추천곡',`
    <div class="radio"><div class="portrait"><img src="img/ng-dance.jpg" alt="헤드폰 낀 늘곰"></div>
      <div style="min-width:0"><div class="label" style="color:#ffcc33">ON AIR · ${d.getMonth()+1}/${d.getDate()}</div><div class="t">${s.t}</div><div class="a">${s.a}</div><div class="eq"><i></i><i></i><i></i><i></i><i></i></div></div></div>
    <div class="npc"><div class="portrait" style="width:64px;height:64px"><img src="img/ng-yawn.jpg" alt="늘곰"></div><div class="bubble"><span class="who">DJ 늘곰</span>${s.note}</div></div>
    <div class="row"><a class="bk sky" href="https://www.youtube.com/results?search_query=${encodeURIComponent(s.a+' '+s.t)}" target="_blank" rel="noopener">유튜브에서 듣기</a>
      <button class="bk ${S.heart?'red':''}" id="heart">${S.heart?'♥ 좋아요 보냄':'♡ 좋아요'}</button></div>
    ${(DEMO&&!HQ.on)?`<p class="note">곡은 매일 본부(구글 시트)에서 바뀌어요. 위 곡은 예시예요.</p>`:""}`, b=>{
      b.querySelector('#heart').onclick=e=>{ S.heart=!S.heart; save(); if(S.heart) HQ.once('heart'); e.target.className='bk '+(S.heart?'red':''); e.target.textContent=S.heart?'♥ 좋아요 보냄':'♡ 좋아요'; };
  });
}

/* ---------- 날씨 ---------- */
const MOOD_SVG={
  sun:`<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="8" fill="#ffcc33" stroke="#1a1917" stroke-width="2.5"/><path d="M17 2v5M17 27v5M2 17h5M27 17h5M6 6l3 3M25 25l3 3M28 6l-3 3M9 25l-3 3" stroke="#1a1917" stroke-width="2.5"/></svg>`,
  cloud:`<svg viewBox="0 0 34 34"><circle cx="12" cy="13" r="6" fill="#ffcc33" stroke="#1a1917" stroke-width="2.5"/><path d="M9 28h17a5 5 0 0 0 0-10 7 7 0 0 0-13-1 5.5 5.5 0 0 0-4 11z" fill="#fff" stroke="#1a1917" stroke-width="2.5"/></svg>`,
  fog:`<svg viewBox="0 0 34 34"><path d="M4 11h22M8 17h22M4 23h22M10 29h16" stroke="#8f96a3" stroke-width="3.5" stroke-linecap="round"/></svg>`,
  rain:`<svg viewBox="0 0 34 34"><path d="M7 20h19a5 5 0 0 0 0-10 7 7 0 0 0-13-1 5.5 5.5 0 0 0-6 11z" fill="#c9d0da" stroke="#1a1917" stroke-width="2.5"/><path d="M11 24l-2 6M18 24l-2 6M25 24l-2 6" stroke="#4aa6e8" stroke-width="2.5" stroke-linecap="round"/></svg>`,
  storm:`<svg viewBox="0 0 34 34"><path d="M7 18h19a5 5 0 0 0 0-10 7 7 0 0 0-13-1 5.5 5.5 0 0 0-6 11z" fill="#8f96a3" stroke="#1a1917" stroke-width="2.5"/><path d="M18 18l-5 8h6l-3 7 8-10h-6l3-5z" fill="#ffcc33" stroke="#1a1917" stroke-width="2"/></svg>`
};
const MOOD_COL={sun:'#ffcc33',cloud:'#c9d0da',fog:'#a7adb5',rain:'#4aa6e8',storm:'#7a5cc4'};
function distHTML(D){ const mx=Math.max(1,...MOODS.map(m=>D[m.k]||0)); return MOODS.map(m=>`<div><span>${m.name}</span><span class="b"><i style="width:${(D[m.k]||0)/mx*100}%;background:${MOOD_COL[m.k]}"></i></span><span>${D[m.k]||0}명</span></div>`).join(''); }
function openWeather(){
  sheet('마음 날씨','오늘 내 마음은 어떤 날씨?',`
    <div class="moods">${MOODS.map(m=>`<button class="mood" data-k="${m.k}" aria-pressed="${S.mood===m.k}">${MOOD_SVG[m.k]}${m.name}</button>`).join('')}</div>
    <div id="mReply"></div>
    <div class="card"><div class="label">마음 훈련실</div><h3 style="margin-top:4px">안개 몬스터 이름 붙이기</h3><p>학교에서 있을 법한 장면 속 마음에 이름을 붙여요. 정답은 없어요. 입력한 건 저장되지 않아요.</p><div style="margin-top:10px"><button class="bk yellow wide" id="toEmo">시작하기</button></div></div>
    ${(DEMO||HQ.on)?`<div class="card"><div class="label">오늘 요원들의 마음 날씨${HQ.on?'':' (시연용 예시)'}</div><div class="dist" id="mDist" style="margin-top:8px">${distHTML(HQ.on?((HQ.cached()||{}).moods||{}):SAMPLE_DIST)}</div>
      <p class="note" style="margin-top:8px">이름 없이 숫자만 모여요. 누가 뭘 골랐는지는 아무도 몰라요.</p></div>`:''}`, b=>{
    if(HQ.on) HQ.state(true).then(st=>{ const d=b.querySelector('#mDist'); if(d&&st&&st.moods) d.innerHTML=distHTML(st.moods); });
    const rep=b.querySelector('#mReply');
    const show=k=>{ const m=MOODS.find(x=>x.k===k); const heavy=['fog','rain','storm'].includes(k);
      rep.innerHTML=`<div class="npc"><div class="portrait" style="width:72px;height:72px"><img src="img/ng-base.jpg" alt="늘곰"></div><div class="bubble"><span class="who">늘곰 소장</span>${m.reply}</div></div>
      ${heavy?`<div class="row"><button class="bk sky" id="mB">숨 고르기</button><button class="bk" id="mP">이야기할 곳</button></div>`:''}`;
      if(heavy){ rep.querySelector('#mB').onclick=openBreathRoom; rep.querySelector('#mP').onclick=openPhone; } };
    b.querySelectorAll('.mood').forEach(x=>x.onclick=()=>{ S.mood=x.dataset.k; save(); HQ.mood(x.dataset.k); b.querySelectorAll('.mood').forEach(y=>y.setAttribute('aria-pressed',y===x)); show(x.dataset.k); });
    if(S.mood) show(S.mood);
    b.querySelector('#toEmo').onclick=openEmotion;
  });
}

function openEmotion(){
  sheet('안개 몬스터 이름 붙이기','마음 훈련실',`<div id="emoHost"></div><p class="note">고른 단어는 어디에도 저장되지 않아요.</p>`, b=>{
    const h=b.querySelector('#emoHost');
    mgStop=MG.run(h,'emotion',{doneBtn:'감정 도감 배지 받기',doneLabel:'특별 배지 · 감정 도감',onDone:()=>{ stopMG(); SpyPlus.addXP(SpyPlus.XP.minigame,'미니게임'); S.badges=Object.assign({},S.badges,{emotion:true}); save();
      h.innerHTML='<div class="got"><div class="label">특별 배지</div><h3 style="font-size:24px;margin:6px 0">감정 도감</h3><p>마음에 이름을 붙이면 조금 떨어져서 볼 수 있어요. 마음이 너무 크게 느껴지면 본부 전화를 눌러요.</p></div><div class="row"><button class="bk" id="emoW">마음 날씨로</button><button class="bk green" id="emoP">본부 전화</button></div>';
      h.querySelector('#emoP').onclick=openPhone; h.querySelector('#emoW').onclick=openWeather; }});

}

/* ---------- 하늘 게시판 ---------- */
const SKY_SAMPLE=['오늘 하늘 진짜 파랬다','급식 김치볶음밥 최고였음','운동장 노을 본 사람?','천천히 가도 괜찮아','음악실 피아노 소리 좋았어','다들 시험 화이팅'];
function skyLines(){ if(HQ.on) return ((HQ.cached()||{}).sky||[]).map(t=>({t:String(t)}));
  return (DEMO?SKY_SAMPLE.map(t=>({t,ex:true})):[]).concat((S.skyOk||[]).map(t=>({t}))); }
const SKY_RISK=/죽고|죽을|죽어|죽는|자살|자해|극단|사라지고|없어지고|살기\s*싫|살고\s*싶지|끝내고\s*싶|힘들어서\s*못|때리|때려|맞았|맞고|괴롭|따돌|왕따|협박|무서워/;
function skyPos(i){ const cols=[26,68,36,74,28,54,72,32,58,42,76,30]; const rows=[10,16,30,36,50,56,70,76,22,44,62,84]; return {x:cols[i%cols.length], y:rows[i%rows.length]}; }
function drawSky(box,newIdx){
  const L=skyLines(), clear=Math.min(1, L.length/14*0.7 + progress()*0.3);
  box.style.setProperty('--clear',clear.toFixed(2));
  box.querySelector('.skyfog').style.opacity=(1-clear).toFixed(2);
  box.querySelector('.skymsgs').innerHTML=L.map((m,i)=>{const p=skyPos(i); return `<div class="skym ${i===newIdx?'new':''}" style="left:${p.x}%;top:${p.y}%;animation-delay:${(i%5)*.7}s">${m.t.replace(/[<>&]/g,'')}${m.ex?'<i>예시</i>':''}</div>`;}).join('');
}
function openSky(){
  if(!S.skyPend) S.skyPend=[]; if(!S.skyOk) S.skyOk=[];
  sheet('하늘 게시판','안개 낀 하늘에 한 줄 띄우기',`
    <div class="skybox" id="skyBox"><div class="skyfog"></div><div class="skymsgs"></div></div>
    <p class="note">${HQ.on?"요원들이 남긴 한 줄은 선생님이 확인한 뒤 하늘에 떠요. 한 줄이 뜰 때마다 그 주변 안개가 걷혀요. 이름은 어디에도 남지 않아요.":DEMO?"요원들이 남긴 한 줄이 하늘에 뜰 때마다 그 주변 안개가 걷혀요. (시연: 아직 본부와 연결되지 않아 이 휴대폰 안에서만 보여요.)":"내가 띄운 한 줄마다 하늘의 안개가 걷혀요. 이 글은 이 휴대폰에만 저장되고, 다른 사람에게는 보이지 않아요."}</p>
    <div class="card"><div class="label">한 줄 남기기 · 이름 없이</div>
      <div class="skyin"><input id="skyText" maxlength="30" placeholder="오늘 본 하늘, 고마운 일, 응원 한마디" autocomplete="off"><button class="bk green" id="skySend">띄우기</button></div>
      <p class="note" id="skyMsg" style="margin-top:6px">30자까지 쓸 수 있어요. 이름이나 연락처, 친구 이름은 쓰지 않기.</p>
      <p class="note" style="margin-top:6px">힘든 마음은 하늘보다 사람에게 먼저 털어놓아요. <button class="linkbtn" id="skyHelp">Wee클래스 · 1388 안내</button></p></div>
    ${(DEMO&&!HQ.on)?`<details class="card review"><summary>선생님 검토 (시연)</summary>
      <p class="note" style="margin:8px 0">실제 운영에서는 구글 시트 '하늘' 탭의 승인 칸을 체크하면 공개돼요. 시연에서는 이 휴대폰 안에서만 승인돼요.</p>
      <div class="skyin"><input id="skyPin" inputmode="numeric" maxlength="4" placeholder="교사 PIN (시연 1234)" autocomplete="off"><button class="bk" id="skyPinGo">열기</button></div>
      <div id="skyQueue" style="margin-top:10px"></div></details>`:''}`, b=>{
    const box=b.querySelector('#skyBox'), msg=b.querySelector('#skyMsg');
    drawSky(box);
    if(HQ.on){ const sk=(HQ.cached()||{}).sky||[]; S.skyPend=S.skyPend.filter(t=>!sk.includes(t)); }
    const pendNote=()=>{ if(HQ.on){ msg.textContent = S.skyPend.length ? `선생님 확인을 기다리는 내 글 ${S.skyPend.length}개. 확인되면 하늘에 떠요.` : '30자까지 쓸 수 있어요. 이름이나 연락처, 친구 이름은 쓰지 않기.'; return; }
      msg.textContent = (DEMO&&S.skyPend.length) ? `검토 대기 중인 내 글 ${S.skyPend.length}개 (시연: 이 휴대폰 안에만 있어요).` : '30자까지 쓸 수 있어요. 이름이나 연락처, 친구 이름은 쓰지 않기.'; };
    pendNote();
    b.querySelector('#skySend').onclick=()=>{ const inp=b.querySelector('#skyText'); const t=inp.value.trim().slice(0,30); if(!t){ msg.textContent='한 줄을 먼저 써 주세요.'; return; }
      if(SKY_RISK.test(t)){ HQ.add('risk'); inp.value=''; openPhone('방금 쓴 말이 마음에 걸린다. 그 글은 어디에도 보내지 않았다. 혼자 버티지 말고, 아래 번호로 지금 이야기해 보자.'); return; }
      if(HQ.on){ const btn=b.querySelector('#skySend'); btn.disabled=true; msg.textContent='본부로 보내는 중…';
        HQ.sky(t).then(r=>{ btn.disabled=false;
          if(r&&r.ok){ S.skyPend.push(t); if(S.skyPend.length>5) S.skyPend.shift(); save(); inp.value=''; pendNote(); toast('본부로 보냈어요. 선생님이 확인하면 하늘에 떠요.'); }
          else msg.textContent = (r&&r.msg==='busy') ? '지금 글이 많이 몰렸어요. 조금 뒤에 다시 띄워 주세요.' : '지금은 본부와 연결이 안 돼요. 잠시 뒤 다시 해 주세요.'; }); }
      else if(DEMO){ S.skyPend.push(t); save(); inp.value=''; pendNote(); toast('이 휴대폰에 저장했어요. (시연: 아직 본부로 전송되지는 않아요)'); }
      else { S.skyOk.push(t); if(S.skyOk.length>12) S.skyOk.shift(); save(); inp.value=''; drawSky(box, skyLines().length-1); toast('하늘에 띄웠어요. 이 휴대폰에만 저장돼요.'); } };
    b.querySelector('#skyHelp').onclick=()=>openPhone();
    if(HQ.on) HQ.state(true).then(st=>{ if(st&&b.isConnected){ drawSky(box); const sk=st.sky||[]; S.skyPend=S.skyPend.filter(t=>!sk.includes(t)); save(); pendNote(); } });
    const q=b.querySelector('#skyQueue'); if(!q) return;
    const drawQ=()=>{ q.innerHTML = S.skyPend.length ? S.skyPend.map((t,i)=>`<div class="qrow"><span>${t.replace(/[<>&]/g,'')}</span><button class="bk green" data-ok="${i}">승인</button><button class="bk" data-no="${i}">반려</button></div>`).join('') : '<p class="note">검토할 글이 없어요.</p>';
      q.querySelectorAll('[data-ok]').forEach(x=>x.onclick=()=>{ const t=S.skyPend.splice(+x.dataset.ok,1)[0]; S.skyOk.push(t); save(); drawQ(); pendNote(); drawSky(box, skyLines().length-1); box.scrollIntoView({behavior:'smooth',block:'nearest'}); });
      q.querySelectorAll('[data-no]').forEach(x=>x.onclick=()=>{ S.skyPend.splice(+x.dataset.no,1); save(); drawQ(); pendNote(); }); };
    b.querySelector('#skyPinGo').onclick=()=>{ if(b.querySelector('#skyPin').value==='1234') drawQ(); else q.innerHTML='<p class="note">PIN이 맞지 않아요.</p>'; };
  });
}

/* ---------- 전화 ---------- */
function openPhone(lead){ if(typeof lead!=='string') lead=''; HQ.once('phone');
  const L=(cls,title,num,tel,desc)=>`<div class="line ${cls}"><h3>${title}</h3><div class="num">${num}</div><div class="acts">${tel?`<a class="bk green" href="tel:${tel}">전화</a><button class="bk" data-copy="${num}">번호 복사</button>`:''}</div><p>${desc}</p></div>`;
  sheet('본부 전화','혼자 버티지 않아도 돼요',`
    <div class="npc"><div class="portrait pt-bear"><img src="img/neulgom-head.webp" alt="늘곰 소장"></div><div class="bubble"><span class="who">늘곰 소장</span>${lead||"힘들 때 도움을 청하는 건 요원의 기본 수칙이다. 아래 번호는 언제든 열려 있다."} 상담한 내용은 함부로 알려지지 않는다. 다만 네 안전이 걱정될 때는, 너를 지키려고 도와줄 어른에게 알릴 수 있다.</div></div>
    ${L('hq','Wee클래스 (비밀 본부)','3층','', '쉬는 시간, 점심시간에 그냥 들러도 돼요. 전문상담 선생님이 기다려요.')}
    ${L('','청소년상담 1388','1388','1388','24시간 · 전화. 문자는 #1388, 카카오톡은 「청소년상담1388」 채널. 고민 무엇이든.')}
    ${L('','자살예방 상담전화','109','109','24시간. 죽고 싶다는 생각이 들 때, 주변 사람이 걱정될 때.')}
    ${L('','학교폭력 신고·상담','117','117','24시간. 문자 #0117도 가능.')}
    <p class="note">지금 위험한 상황이면 112(경찰) 또는 119로 바로 연락하세요.</p>`, b=>{
    b.querySelectorAll('[data-copy]').forEach(x=>x.onclick=()=>{ const v=x.dataset.copy;
      (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>{x.textContent='번호 복사됨';}).catch(()=>{ const r=document.createRange(); r.selectNodeContents(x.closest('.line').querySelector('.num')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); x.textContent='선택됨'; }); });
  });
}

/* ---------- 꾸미기 ---------- */
function openCloset(){
  let tab='face';
  const T={face:['표정',FACES],hair:['머리',HAIRS],top:['상의',TOPS],bottom:['하의',BOTS]};
  sheet('요원 위장실','완벽한 평범함으로 위장하라',`
    <div class="closet"><div class="mirror" id="mir"></div>
      <div style="min-width:0"><div class="tabs" role="tablist">${Object.entries(T).map(([k,v])=>`<button role="tab" data-t="${k}" aria-selected="${k===tab}">${v[0]}</button>`).join('')}</div>
      <div class="opts" id="opts"></div><div class="colors" id="cols"></div></div></div>
    <button class="bk green wide" id="clDone">위장 완료</button>`, b=>{
    const mir=b.querySelector('#mir'), opts=b.querySelector('#opts'), cols=b.querySelector('#cols');
    const draw=()=>{
      mir.innerHTML=avatarSVG(S.av);
      opts.innerHTML=T[tab][1].map((n,i)=>{ const a=Object.assign({},S.av,{[tab]:i}); return `<button class="opt ${tab==='face'||tab==='hair'?'face':''}" data-i="${i}" aria-pressed="${S.av[tab]===i}">${tab==='bottom'?avatarSVG(a).replace('viewBox="0 0 100 140"','viewBox="20 84 60 56" style="width:48px;height:45px"'):tab==='top'?avatarSVG(a).replace('viewBox="0 0 100 140"','viewBox="14 46 72 50" style="width:56px;height:39px"'):`<div style="height:40px;overflow:hidden;width:60px">${avatarSVG(a)}</div>`}${n}</button>`; }).join('');
      opts.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ S.av[tab]=+o.dataset.i; save(); draw(); });
      cols.innerHTML = tab==='top' && ![0,2,4].includes(S.av.top) ? TOPC.map((c,i)=>`<button style="background:${c}" data-c="${i}" aria-label="색 ${i+1}" aria-pressed="${S.av.tc===i}"></button>`).join('') : '';
      cols.querySelectorAll('button').forEach(c=>c.onclick=()=>{ S.av.tc=+c.dataset.c; save(); draw(); });
      b.querySelectorAll('[role=tab]').forEach(t=>t.setAttribute('aria-selected',t.dataset.t===tab));
    };
    b.querySelectorAll('[role=tab]').forEach(t=>t.onclick=()=>{ tab=t.dataset.t; draw(); });
    b.querySelector('#clDone').onclick=closeSheet;
    draw();
  });
}

function lobby(){
  $('#lobbyAv').innerHTML=avatarSVG(S.av);
  $('#spyCode').innerHTML=`${S.code} <button id="codeRe" style="font:inherit;font-size:12px;border:2px solid var(--ink);border-radius:6px;background:#fff;padding:2px 6px;margin-left:4px">다시 뽑기</button>`; $('#codeRe').onclick=()=>{ S.code=newCode(); save(); lobby(); };
  $('#demoBox').hidden=!DEMO;

    // 날아가는 조각
    fly=fly.filter(f=>f.t<1.5); fly.forEach(f=>{ f.t+=dt; f.vy+=1500*dt; f.x+=f.vx*dt; f.y+=f.vy*dt; f.r+=f.vr*dt;
      if(f.y>fy&&f.vy>0&&f.b<2){ f.y=fy; f.vy*=-.38; f.vx*=.6; f.vr*=.5; f.b++; if(f.b===1) wxTick(.18,3000+Math.random()*2500,.02,0,7); }
      g.save(); g.globalAlpha=Math.max(0,Math.min(1,(1.5-f.t)*2.5)); g.translate(f.x,f.y); g.rotate(f.r); g.beginPath(); f.poly.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.closePath();
      const fg=g.createLinearGradient(-14,-14,14,14); fg.addColorStop(0,col[1]); fg.addColorStop(.5,col[0]); fg.addColorStop(1,col[4]); if(ok(cimg)){ g.save(); g.clip(); g.drawImage(cimg,-R-f.ox,-R-f.oy,R*2,R*2); g.restore(); } else { g.fillStyle=fg; g.fill(); } g.lineWidth=1; g.strokeStyle='rgba(255,255,255,.7)'; g.stroke(); g.fillStyle='rgba(255,255,255,.55)'; g.beginPath(); g.arc(f.poly[0][0]*.3,f.poly[0][1]*.3,2.2,0,6.283); g.fill(); g.restore(); });
    dust=dust.filter(d=>d.t<.7); dust.forEach(d=>{ d.t+=dt; d.vy+=900*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; g.globalAlpha=1-d.t/.7; g.fillStyle=d.w?'#fff':col[1]; g.fillRect(d.x,d.y,d.z,d.z); }); g.globalAlpha=1;
    pops=pops.filter(p=>p.t<.8); pops.forEach(p=>{ p.t+=dt; const k=Math.min(1,p.t/.12); g.globalAlpha=Math.max(0,1-(p.t-.4)/.4); g.font=`900 ${(p.big?26:17)*(.6+.4*k)}px system-ui,sans-serif`; g.textAlign='center';
      const X=Math.max(40,Math.min(W-40,p.x)), Y=Math.max(22,p.y-p.t*38); g.lineWidth=4; g.strokeStyle='#fffaf0'; g.strokeText(p.s,X,Y); g.fillStyle='#1a1917'; g.fillText(p.s,X,Y); }); g.globalAlpha=1;
  }
  build(); requestAnimationFrame(frame);
}
