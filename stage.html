<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>회색 안개 작전</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="안개 작전">
<meta name="theme-color" content="#1f1b18">
<link rel="manifest" href="stage.webmanifest">
<link rel="apple-touch-icon" href="img/stage-icon-180.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@500;700&display=swap">
<style>
html,body{margin:0}
html,body,#stage,#stage *{touch-action:manipulation;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
/* 배치: 화면 전체가 픽셀 게임. 세로로 든 폰에서는 무대를 90도 돌려 가로로 눕혀서 하게 한다. 모집 포스터 색(주홍·크림·먹색·황토) 한 가지 모습. */
:root{
  --ink:#1f1b18; --paper:#f6ead0; --panel:#fff8e8;
  --red:#d9512c; --red-d:#a03a1c; --ocher:#c9993f; --sky:#69b4e6;
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--ink);font-family:var(--f-body);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#aeb4ba}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.btn{position:absolute;border:3px solid var(--ink);background:rgba(246,234,208,.78);color:var(--ink);
  font-family:var(--f-display);display:flex;align-items:center;justify-content:center;touch-action:none;
  box-shadow:0 4px 0 var(--ink);border-radius:6px}
.btn::before{content:"";position:absolute;inset:-10px}
.btn.on{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);background:var(--paper)}
#pad{left:max(12px,env(safe-area-inset-left,0px));bottom:12px;width:136px;height:60px;font-size:24px;justify-content:space-around}
#pad span{pointer-events:none;opacity:.75}
#pad span.on{color:var(--red);opacity:1}
#bj{right:max(12px,env(safe-area-inset-right,0px));bottom:12px;width:72px;height:66px;font-size:19px;background:rgba(217,81,44,.86);color:#fff8e8}
#bj.on{background:var(--red-d)}
#bb{right:calc(max(12px,env(safe-area-inset-right,0px)) + 84px);bottom:12px;width:58px;height:54px;font-size:17px}
.top{top:7px;width:34px;height:32px;font-size:15px;box-shadow:0 3px 0 var(--ink);border-width:3px}
.top::before{inset:-5px}
#bh{right:max(10px,env(safe-area-inset-right,0px));z-index:6}
#hv{z-index:7}
#bs{right:calc(max(10px,env(safe-area-inset-right,0px)) + 42px)}
.btn:focus-visible,.ov button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.ov{position:absolute;inset:0;background:rgba(31,27,24,.62);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.card{background:var(--panel);border:4px solid var(--ink);border-radius:6px;box-shadow:0 6px 0 var(--ink);
  max-width:520px;width:100%;max-height:100%;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:11px}
.card h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
.card h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.card p{margin:0;font-size:14.5px;line-height:1.55}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--red-d);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px}
.ov button{font-family:var(--f-display);font-size:18px;border:3px solid var(--ink);border-radius:6px;background:var(--paper);
  color:var(--ink);padding:10px 14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;flex:1 1 auto;min-width:0}
.ov button.go{background:var(--red);color:#fff8e8;font-size:22px;padding:12px 18px}
.ov button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.note{font-size:12.5px;color:#5c5348}
.hqtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media (max-width:720px){ .hqtop{padding-right:34px} }   /* 좁은 화면에서는 오른쪽 위 ☎ 버튼이 카드 모서리에 걸친다 */
.raid{display:flex;align-items:center;gap:6px;font-size:12px;color:#5c5348;font-variant-numeric:tabular-nums}
.raid i{display:block;width:84px;height:9px;border:2px solid var(--ink);background:#fff}
.raid b{display:block;height:100%;width:0;background:var(--red)}
.card p.ntc{font-size:13px;line-height:1.35;border-left:4px solid var(--ocher);padding-left:8px}
.song{display:inline-block}   /* 추천곡 한 줄은 낱말 가운데서 끊기지 않고 통째로 다음 줄로 넘어간다 */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.days button{display:flex;flex-direction:column;gap:3px;align-items:center;padding:9px 4px;font-size:15px}
.days small{font-family:var(--f-body);font-size:11px;color:#5c5348}
.days b{font-weight:400;line-height:1.15;text-wrap:balance}
.days span{font-family:var(--f-body);font-size:11px;color:var(--red-d);min-height:14px}
.days button:disabled{opacity:.45;box-shadow:none}
.wx{position:relative;border:3px solid var(--ink);overflow:hidden;touch-action:none}
.wxagain{position:absolute;right:8px;bottom:8px;font-size:13px;padding:6px 10px}
.wxrow{align-items:center;justify-content:space-between;flex-wrap:nowrap}
.wxrow .note{margin:0;text-align:left}
.card.wide{max-width:640px;gap:9px;padding:13px 18px}
.card.wide h1{font-size:25px}
/* 키가 낮은 화면(가로로 눕힌 작은 폰, 주소창이 보이는 사파리)에서는 넓은 카드를 조금 조여 「본부로」 버튼까지 한 화면에 들어오게 한다 */
@media (max-height:380px){ .card.wide{padding:10px 16px;gap:7px} .card.wide .order{padding:6px 12px} .card.wide .stat div{padding:4px 6px} .ov .card.wide button.go{padding:9px 18px} }
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat div{border:3px solid var(--ink);border-radius:4px;padding:6px 6px;text-align:center;background:var(--paper);font-size:12px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.order{border:3px dashed var(--ink);border-radius:4px;padding:10px 12px;background:#fff}
.tel{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.tel b{font-family:var(--f-display);font-weight:400;font-size:18px;-webkit-user-select:text;user-select:text}
</style>

  if(P.shield){ bx.fillStyle='#1f1b18'; bx.fillRect(86,7,9,7); bx.fillRect(87,14,7,2); bx.fillRect(89,16,3,1); bx.fillStyle='#69b4e6'; bx.fillRect(87,8,7,6); bx.fillRect(88,14,5,1); bx.fillRect(89,15,3,1); }
  { const x0=108, x1=W-Math.ceil(92*dprU/k)-4; if(x1>x0+30){ bx.fillStyle='#1f1b18'; bx.fillRect(x0,11,x1-x0,3); bx.fillStyle='#8b9198'; bx.fillRect(x0,12,x1-x0,1); bx.fillStyle='#d9512c'; bx.fillRect(x0,12,Math.round((x1-x0)*Math.min(1,(room?room.ret:P.x)/door.x)),1);
      for(const f of flags){ bx.fillStyle=f.on?'#d9512c':'#1f1b18'; bx.fillRect(Math.round(x0+(x1-x0)*f.x/door.x),9,1,7); } } }
  // 병아리 말 칸. 위쪽 표시 줄의 정해진 자리에 뜬다 (크기와 자리는 변하지 않는다). 아래쪽에 두면 땅을 덮어 낭떠러지가 안 보인다

    const al=(1-dark)*bubA; bx.globalAlpha=al; box(bX,bY,bw,bh,'#fff8e8','#1f1b18'); spr(A.CHICK[Math.floor(tNow*4)%2],bX+4,bY+Math.round(bh/2)-6,true); bx.globalAlpha=1;
    const n=bubble.lines.length, lh=bubble.fs+2, y0=bY+Math.round((bh-n*lh)/2)+bubble.fs, tal=(1-dark)*(.3+bubA*.7); bubble.lines.forEach((l,i)=>texts.push({t:l,x:bX+19,y:y0+i*lh,s:bubble.fs,c:'#1f1b18',w:'700',f:BODY,al:tal})); }

// 본부 라디오의 오늘 추천곡 한 줄 (관리 시트의 음악 탭에 그날 곡이 있을 때만)

function music(){ const okay=sound&&running&&AC&&AC.state==='running'&&!document.hidden;
  if(!okay){ BGM.pause(); return; }
