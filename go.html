<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f1b18">
<title>늘곰 요원 본부</title>
<link rel="icon" href="img/stage-icon-192.png">
<link rel="apple-touch-icon" href="img/stage-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@500;700&display=swap">
<style>
/* 키링(NFC)을 찍으면 처음 열리는 시작 페이지.
   구겨진 지령지 세 장: 누르면 펴지고, 펴진 종이를 한 번 더 누르면 접속한다.
   지령 내용과 링크는 아래 <script>의 ORDERS 한 곳에서만 고친다. */
:root{
  --ink:#1f1b18; --paper:#f6ead0; --panel:#fff8e8;
  --red:#d9512c; --red-d:#a03a1c; --ocher:#c9993f; --mute:#5c5348;
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh;color:var(--ink);font-family:var(--f-body);overflow-x:hidden;
  background:#2b2520 radial-gradient(120% 70% at 50% 0%,#4a3d31 0%,#2b2520 60%,#1f1b18 100%);
  display:flex;justify-content:center;padding:max(18px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
.top{display:flex;align-items:center;gap:12px;width:100%}
.top img{width:64px;height:auto;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.tag{display:inline-block;font-family:var(--f-display);font-size:13px;letter-spacing:.08em;background:var(--red);color:var(--panel);padding:3px 9px;border-radius:3px}
h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:6px 0 0;color:var(--panel)}
.sub{margin:14px 0 0;font-size:14.5px;line-height:1.5;color:#e7dcc4;width:100%}
.sub b{color:#ffd9a8;font-weight:700}

/* 구겨진 종이 더미 */
.pile{position:relative;width:100%;height:min(118vw,520px);margin-top:6px}
.ball{position:absolute;width:46%;aspect-ratio:3/4;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;
  transition:transform .18s ease}
.ball:active{transform:scale(.95) rotate(var(--r))!important}
.ball canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 6px rgba(0,0,0,.5))}
.ball .stamp{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(var(--sr,-6deg));
  font-family:var(--f-display);font-size:19px;line-height:1;white-space:nowrap;color:var(--panel);background:var(--ink);
  border:2px solid var(--panel);border-radius:6px;padding:7px 10px 6px;box-shadow:0 3px 0 rgba(0,0,0,.35);pointer-events:none}
.ball .stamp.red{background:var(--red)}
.ball .stamp.q{background:var(--ocher);color:var(--ink);font-size:26px;padding:5px 14px}
.ball .num{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--f-display);font-size:13px;color:var(--panel);
  opacity:.85;letter-spacing:.1em;pointer-events:none;text-shadow:0 1px 2px #000}
.ball.gone{visibility:hidden}
.ball.wiggle{animation:wig .5s}
@keyframes wig{20%{transform:rotate(calc(var(--r) - 8deg))}50%{transform:rotate(calc(var(--r) + 7deg))}80%{transform:rotate(calc(var(--r) - 3deg))}}
footer{margin-top:auto;padding-top:18px;font-size:12px;color:#9b8f7c;text-align:center}

/* 펴진 지령지 */
#veil{position:fixed;inset:0;background:rgba(20,17,14,.72);opacity:0;pointer-events:none;transition:opacity .35s;z-index:5}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;inset:0;width:100%;height:100%;z-index:6;display:none;cursor:pointer;touch-action:manipulation}
#hint{position:fixed;left:0;right:0;z-index:7;text-align:center;color:var(--panel);font-family:var(--f-display);font-size:17px;opacity:0;transition:opacity .3s;pointer-events:none}
#hint.on{opacity:1}
#back{position:fixed;left:50%;transform:translateX(-50%);z-index:7;font-family:var(--f-display);font-size:17px;background:transparent;color:#e7dcc4;
  border:2px solid #e7dcc4;border-radius:999px;padding:8px 18px;opacity:0;pointer-events:none;transition:opacity .3s;cursor:pointer}
#back.on{opacity:1;pointer-events:auto}

/* 영상 창 */
#vbox{position:fixed;inset:0;background:rgba(20,17,14,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:9}
#vbox[hidden]{display:none}
#vbox video{width:100%;max-width:720px;max-height:78vh;border:3px solid var(--panel);border-radius:10px;background:#000}
#vclose{margin-top:16px;font-family:var(--f-display);font-size:20px;background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:10px 26px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.ball{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <img src="img/neulgom-head.webp" alt="" width="300" height="300">
    <div><span class="tag">본부 → 요원</span><h1>지령이 도착했다.</h1></div>
  </div>
  <p class="sub">들키지 않게 구겨서 보냈다. <b>종이를 눌러 펴고</b>, 펴진 지령을 <b>한 번 더 누르면</b> 접속한다.</p>
  <div class="pile" id="pile"></div>
  <footer>합천중학교 마음돌봄 작전 · 늘곰 본부</footer>
</main>

<div id="veil"></div>
<canvas id="sheet" role="button" aria-live="polite"></canvas>
<div id="hint">한 번 더 누르면 접속</div>
<button id="back" type="button">다시 구기기</button>

<div id="vbox" hidden>
  <video id="vid" controls playsinline preload="none"></video>
  <button id="vclose" type="button">닫기</button>
</div>

<script>
/* ===== 지령 목록: 여기만 고치면 된다 =====
   stamp : 구겨진 종이 위에 붙는 딱지(구겨져 있어도 무엇인지 알 수 있게)
   title, lines : 펴진 종이에 적히는 글(lines는 한 줄씩, 너무 길면 잘림 — 한 줄 13자 안팎)
   type:"video" 는 이 페이지 안에서 영상 재생, type:"locked" 는 아직 비워 둔 지령(누르면 펴지기만 함)
   href : 접속할 주소. 공지·설문을 붙일 땐 세 번째 지령의 type을 지우고 href를 넣으면 된다. */
const ORDERS = [
  { stamp:"▶ 작전 시작", red:true, code:"지령 01", title:"작전 시작",
    lines:["회색 안개 속으로 들어가","오늘의 증거품을 찾아라.","","하루 한 판, 3분이면 충분."],
    button:"게임 접속", href:"stage.html" },
  { stamp:"🎬 세계관 영상", code:"지령 02", title:"기밀 영상",
    lines:["학교의 색이 사라진 날,","무슨 일이 있었는지","먼저 확인하고 출동하라."],
    button:"영상 보기", type:"video",
    href:"https://d2ol7oe51mr4n9.cloudfront.net/user_3L0PVa2SvrCt0LjjzuaEuAargjS/9ee9787e-45dd-42b9-9953-0e06e4fbda06.mp4" },
  { stamp:"?", q:true, code:"지령 03", title:"? ? ?", type:"locked",
    lines:["아직 해독되지 않은 지령.","","본부가 때가 되면","이 종이를 채운다."],
    button:"공개 예정" },
];

/* 종이 크기(종이 좌표 단위) */
const W = 300, H = 400;
/* 더미 속 위치: 왼쪽·위(%), 기울기 */
const SPOTS = [ {x:2,y:0,r:-9}, {x:52,y:10,r:8}, {x:27,y:46,r:-3} ];
const DPR = Math.min(3, window.devicePixelRatio || 1);

/* ---------- 작은 난수(종이마다 같은 구김이 나오게) ---------- */
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- 지령지 그림(평평한 상태)을 한 번 그려 둔다 ---------- */
function drawPaper(o){
  const S = 3, cv = document.createElement('canvas'); cv.width = W * S; cv.height = H * S;
  const g = cv.getContext('2d'); g.scale(S, S);
  g.fillStyle = '#f3e6c8'; g.fillRect(0, 0, W, H);
  // 종이 결
  const r = rng(99); g.globalAlpha = .05;
  for (let i = 0; i < 900; i++){ g.fillStyle = r() < .5 ? '#7a5a2a' : '#ffffff'; g.fillRect(r() * W, r() * H, 1.2, 1.2); }
  g.globalAlpha = 1;
  g.setLineDash([6, 5]); g.strokeStyle = '#c9993f'; g.lineWidth = 2; g.strokeRect(14, 14, W - 28, H - 28); g.setLineDash([]);
  g.fillStyle = '#a03a1c'; g.font = '16px "Do Hyeon", sans-serif'; g.fillText(o.code + '  ·  1급 기밀', 34, 60);
  g.fillStyle = '#1f1b18'; g.font = '44px "Do Hyeon", sans-serif'; g.fillText(o.title, 34, 110);
  g.fillRect(34, 127, W - 68, 3);
  g.fillStyle = '#3a332c'; g.font = '700 18px "Gothic A1", sans-serif';
  let y = 168; for (const ln of o.lines){ g.fillText(ln, 34, y); y += 30; }
  const locked = o.type === 'locked';
  g.save(); g.translate(W / 2, H - 66); g.rotate(-.07);
  g.beginPath(); g.roundRect ? g.roundRect(-92, -26, 184, 52, 8) : g.rect(-92, -26, 184, 52);
  if (locked){ g.setLineDash([7, 6]); g.strokeStyle = '#8a7f70'; g.lineWidth = 3; g.stroke(); g.setLineDash([]); }
  else { g.fillStyle = '#d9512c'; g.fill(); g.strokeStyle = '#1f1b18'; g.lineWidth = 3; g.stroke(); }
  g.fillStyle = locked ? '#8a7f70' : '#fff8e8'; g.font = '25px "Do Hyeon", sans-serif'; g.textAlign = 'center'; g.fillText(o.button, 0, 9);
  g.restore();
  return cv;
}

/* ---------- 구김 그물: 종이를 삼각형 조각으로 나누고, 구겨진 자리/펴진 자리를 정해 둔다 ---------- */
function makeMesh(seed){
  const r = rng(seed), C = 6, R = 8, pts = [];
  for (let j = 0; j <= R; j++) for (let i = 0; i <= C; i++){
    let x = i / C * W, y = j / R * H;
    if (i > 0 && i < C) x += (r() - .5) * W / C * .7;
    if (j > 0 && j < R) y += (r() - .5) * H / R * .7;
    const dx = x - W / 2, dy = y - H / 2, d = Math.hypot(dx / W, dy / H) / .71;
    // 구겨진 자리: 가운데로 몰고 마구 흩뜨린다
    const a = r() * Math.PI * 2, m = 24 + r() * 52;
    pts.push({ x, y, d, cx: W / 2 + dx * .28 + Math.cos(a) * m, cy: H / 2 + dy * .22 + Math.sin(a) * m * .95, k: r() });
  }
  const tris = [];
  for (let j = 0; j < R; j++) for (let i = 0; i < C; i++){
    const a = j * (C + 1) + i, b = a + 1, c = a + C + 1, d = c + 1;
    const pair = r() < .5 ? [[a, b, d], [a, d, c]] : [[a, b, c], [b, d, c]];
    for (const t of pair) tris.push({ v: t, shade: r(), z: r() });
  }
  tris.sort((p, q) => p.z - q.z); // 구겨졌을 때 겹치는 순서
  return { pts, tris };
}

/* t: 0 = 다 펴짐, 1 = 다 구겨짐. 가운데부터 먼저 펴진다 */
function vertexAt(p, t){
  const s = Math.min(1, Math.max(0, t * 1.5 - (1 - p.d) * .5));
  const e = s * s * (3 - 2 * s);
  return [p.x + (p.cx - p.x) * e, p.y + (p.cy - p.y) * e];
}

function drawMesh(g, tex, mesh, t){
  const TS = tex.width / W, P = mesh.pts.map(p => vertexAt(p, t));
  for (const tr of mesh.tris){
    const [i0, i1, i2] = tr.v, s0 = mesh.pts[i0], s1 = mesh.pts[i1], s2 = mesh.pts[i2];
    const [x0, y0] = P[i0], [x1, y1] = P[i1], [x2, y2] = P[i2];
    // 원래 삼각형(종이 위) → 지금 삼각형(화면) 아핀 변환
    const ux = s1.x - s0.x, uy = s1.y - s0.y, vx = s2.x - s0.x, vy = s2.y - s0.y, det = ux * vy - vx * uy;
    if (Math.abs(det) < 1e-6) continue;
    const ax = x1 - x0, ay = y1 - y0, bx = x2 - x0, by = y2 - y0;
    const a = (ax * vy - bx * uy) / det, c = (bx * ux - ax * vx) / det;
    const b = (ay * vy - by * uy) / det, d = (by * ux - ay * vx) / det;
    const e = x0 - a * s0.x - c * s0.y, f = y0 - b * s0.x - d * s0.y;
    // 살짝 키운 삼각형으로 잘라 이음매를 숨긴다
    const mx = (x0 + x1 + x2) / 3, my = (y0 + y1 + y2) / 3, G = 1.04;
    g.save();
    g.beginPath();
    g.moveTo(mx + (x0 - mx) * G, my + (y0 - my) * G); g.lineTo(mx + (x1 - mx) * G, my + (y1 - my) * G); g.lineTo(mx + (x2 - mx) * G, my + (y2 - my) * G);
    g.closePath(); g.clip();
    g.transform(a, b, c, d, e, f);
    g.drawImage(tex, 0, 0, tex.width, tex.height, 0, 0, W, H);
    g.restore();
    // 조각마다 빛/그늘: 뒤집힌 조각(뒷면)은 더 어둡게, 펴질수록 옅게(자국은 남긴다)
    const area = (x1 - x0) * (y2 - y0) - (x2 - x0) * (y1 - y0);
    const flip = area < 0, k = .035 + .55 * Math.min(1, t * 1.2);
    let col = tr.shade < .45 ? `rgba(40,28,15,${(.35 * k * (1 - tr.shade)).toFixed(3)})` : `rgba(255,252,240,${(.4 * k * tr.shade).toFixed(3)})`;
    if (flip && t > .05) col = `rgba(120,95,60,${(.55 * Math.min(1, t * 1.5)).toFixed(3)})`;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.lineTo(x2, y2); g.closePath();
    g.fillStyle = col; g.fill();
    if (t > .02){ g.strokeStyle = `rgba(60,45,25,${(.25 * Math.min(1, t * 2)).toFixed(3)})`; g.lineWidth = .6; g.stroke(); }
    else { g.strokeStyle = 'rgba(90,70,40,.08)'; g.lineWidth = .5; g.stroke(); }
  }
}

/* ---------- 더미 ---------- */
const pile = document.getElementById('pile');
const papers = [];
function buildPile(){
  pile.innerHTML = ''; papers.length = 0;
  ORDERS.forEach((o, i) => {
    const s = SPOTS[i % SPOTS.length];
    const b = document.createElement('button');
    b.className = 'ball'; b.type = 'button';
    b.style.left = s.x + '%'; b.style.top = s.y + '%';
    b.style.setProperty('--r', s.r + 'deg'); b.style.transform = `rotate(${s.r}deg)`;
    b.style.setProperty('--sr', (-s.r * .6) + 'deg');
    b.setAttribute('aria-label', o.code + ' ' + o.title + ' 펴기');
    const cv = document.createElement('canvas');
    b.appendChild(cv);
    b.insertAdjacentHTML('beforeend', `<span class="num">${esc(o.code)}</span><span class="stamp${o.red ? ' red' : ''}${o.q ? ' q' : ''}">${esc(o.stamp)}</span>`);
    b.onclick = () => openOrder(i);
    pile.appendChild(b);
    papers.push({ b, cv, tex: drawPaper(o), mesh: makeMesh(17 + i * 31) });
  });
  requestAnimationFrame(drawBalls);
}
function drawBalls(){
  for (const p of papers){
    const r = p.b.getBoundingClientRect(), cv = p.cv;
    cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);
    const g = cv.getContext('2d'); const sc = cv.width / W;
    g.setTransform(sc, 0, 0, sc, 0, 0);
    drawMesh(g, p.tex, p.mesh, 1);
  }
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 펴기·구기기 ---------- */
const sheet = document.getElementById('sheet'), veil = document.getElementById('veil');
const hint = document.getElementById('hint'), back = document.getElementById('back');
const sg = sheet.getContext('2d');
let cur = -1, busy = false;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function target(){
  const vw = innerWidth, vh = innerHeight;
  const w = Math.min(vw - 40, (vh - 150) * W / H, 400);
  return { x:(vw - w) / 2, y:Math.max(24, (vh - w * H / W) / 2 - 16), w, r:0 };
}
function ballBox(i){
  const r = papers[i].b.getBoundingClientRect(), s = SPOTS[i % SPOTS.length];
  // 회전된 버튼의 바깥 상자 → 원래 크기 상자(가운데 맞춤)
  const w = papers[i].b.offsetWidth, h = w * H / W;
  return { x: r.left + r.width / 2 - w / 2, y: r.top + r.height / 2 - h / 2, w, r: s.r };
}
function sizeSheet(){
  sheet.width = Math.round(innerWidth * DPR); sheet.height = Math.round(innerHeight * DPR);
}
function drawSheet(box, t){
  sg.setTransform(1, 0, 0, 1, 0, 0); sg.clearRect(0, 0, sheet.width, sheet.height);
  const sc = box.w / W;
  sg.setTransform(DPR, 0, 0, DPR, 0, 0);
  sg.translate(box.x + box.w / 2, box.y + box.w * H / W / 2); sg.rotate(box.r * Math.PI / 180); sg.scale(sc, sc); sg.translate(-W / 2, -H / 2);
  drawMesh(sg, papers[cur].tex, papers[cur].mesh, t);
}
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function animate(a, b, tA, tB, ms, done){
  if (reduce) ms = 1;
  const t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now - t0) / ms), m = easeOut(k), u = easeInOut(k);
    drawSheet({ x:lerp(a.x, b.x, m), y:lerp(a.y, b.y, m), w:lerp(a.w, b.w, m), r:lerp(a.r, b.r, m) }, lerp(tA, tB, u));
    if (k < 1) requestAnimationFrame(step); else done && done();
  })(t0);
}
function showHint(){
  const to = target(), bottom = to.y + to.w * H / W;
  hint.style.top = (bottom + 14) + 'px'; back.style.top = (bottom + 46) + 'px';
  hint.textContent = ORDERS[cur].type === 'locked' ? '아직 열리지 않은 지령이다' : '종이를 한 번 더 누르면 접속';
  hint.classList.add('on'); back.classList.add('on');
}
function openOrder(i){
  if (busy || cur >= 0) return;
  busy = true; cur = i; sizeSheet();
  const from = ballBox(i);
  sheet.setAttribute('aria-label', ORDERS[i].title + (ORDERS[i].type === 'locked' ? ' (공개 예정)' : ' 접속하기'));
  sheet.style.display = 'block'; papers[i].b.classList.add('gone'); veil.classList.add('on');
  drawSheet(from, 1);
  animate(from, target(), 1, 0, 1000, () => { busy = false; showHint(); });
}
function closeOrder(){
  if (busy || cur < 0) return;
  busy = true; hint.classList.remove('on'); back.classList.remove('on'); veil.classList.remove('on');
  const i = cur;
  animate(target(), ballBox(i), 0, 1, 700, () => {
    sheet.style.display = 'none'; papers[i].b.classList.remove('gone'); cur = -1; busy = false;
  });
}
sheet.onclick = e => {
  if (busy || cur < 0) return;
  const to = target();
  if (e.clientX < to.x || e.clientX > to.x + to.w || e.clientY < to.y || e.clientY > to.y + to.w * H / W) { closeOrder(); return; }
  const o = ORDERS[cur];
  if (o.type === 'locked') { sheet.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}], {duration:320}); return; }
  if (o.type === 'video') { openVideo(o.href); return; }
  location.href = o.href;
};
veil.onclick = closeOrder; back.onclick = closeOrder;
addEventListener('resize', () => { drawBalls(); if (cur >= 0 && !busy){ sizeSheet(); drawSheet(target(), 0); showHint(); } });

/* 글꼴이 다 내려온 뒤에 종이를 그린다(늦어도 1.5초 뒤엔 그린다) */
let built = false;
const build = () => { if (!built){ built = true; buildPile(); } };
(document.fonts ? Promise.race([document.fonts.load('44px "Do Hyeon"').then(() => document.fonts.load('700 18px "Gothic A1"')), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(build, build);

/* 영상 */
const vbox = document.getElementById('vbox'), vid = document.getElementById('vid');
function openVideo(src){ vid.src = src; vbox.hidden = false; vid.play().catch(()=>{}); }
function closeVideo(){ vid.pause(); vbox.hidden = true; }
document.getElementById('vclose').onclick = closeVideo;
vbox.addEventListener('click', e => { if (e.target === vbox) closeVideo(); });
</script>
