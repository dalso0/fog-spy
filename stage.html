<title>회색 안개 작전 시제품</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@500;700&display=swap">
<style>
/* 배치: 화면 전체가 게임. 세로로 든 폰에서는 무대를 90도 돌려 가로로 눕혀서 하게 한다. 모집 포스터 색(주홍·크림·먹색·황토) 한 가지 모습. */
:root{
  --ink:#1f1b18; --paper:#f6ead0; --panel:#fff8e8;
  --red:#d9512c; --red-d:#a03a1c; --ocher:#c9993f; --ocher-d:#8f6a22;
  --fog:#aab0b6; --fog-d:#6f767e; --sky:#69b4e6;
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--ink);font-family:var(--f-body);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--fog)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.btn{position:absolute;border:3px solid var(--ink);background:rgba(255,248,232,.82);color:var(--ink);
  font-family:var(--f-display);display:flex;align-items:center;justify-content:center;touch-action:none;
  box-shadow:0 4px 0 rgba(31,27,24,.55)}
.btn.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(31,27,24,.55);background:var(--paper)}
#pad{left:max(14px,env(safe-area-inset-left,0px));bottom:14px;width:168px;height:74px;border-radius:40px;font-size:30px;justify-content:space-around}
#pad span{pointer-events:none;opacity:.8}
#pad span.on{color:var(--red);opacity:1}
#bj{right:max(14px,env(safe-area-inset-right,0px));bottom:14px;width:88px;height:88px;border-radius:50%;font-size:22px;background:rgba(217,81,44,.9);color:#fff8e8}
#bj.on{background:var(--red-d)}
#bb{right:calc(max(14px,env(safe-area-inset-right,0px)) + 100px);bottom:14px;width:70px;height:70px;border-radius:50%;font-size:20px}
.top{top:10px;width:42px;height:42px;border-radius:12px;font-size:19px;box-shadow:0 3px 0 rgba(31,27,24,.55)}
#bh{right:max(12px,env(safe-area-inset-right,0px))}
#bs{right:calc(max(12px,env(safe-area-inset-right,0px)) + 50px)}
.btn:focus-visible,.ov button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.ov{position:absolute;inset:0;background:rgba(31,27,24,.62);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.card{background:var(--panel);border:3px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink);
  max-width:520px;width:100%;max-height:100%;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.card h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
.card h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.card p{margin:0;font-size:14.5px;line-height:1.55}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--red-d);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px}
.ov button{font-family:var(--f-display);font-size:18px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);
  color:var(--ink);padding:10px 14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;flex:1 1 auto;min-width:0}
.ov button.go{background:var(--red);color:#fff8e8;font-size:22px;padding:12px 18px}
.ov button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.note{font-size:12.5px;color:#5c5348}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat div{border:2px solid var(--ink);border-radius:10px;padding:8px 6px;text-align:center;background:var(--paper);font-size:12px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.order{border:2px dashed var(--ink);border-radius:10px;padding:10px 12px;background:#fff}
.tel{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.tel b{font-family:var(--f-display);font-weight:400;font-size:18px;-webkit-user-select:text;user-select:text}
@media (prefers-reduced-motion:reduce){.btn,.ov button{transition:none}}
</style>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="pad" class="btn" role="group" aria-label="왼쪽 오른쪽"><span id="pl">◀</span><span id="pr">▶</span></div>
  <button id="bb" class="btn" aria-label="숨">숨</button>
  <button id="bj" class="btn" aria-label="점프">점프</button>
  <button id="bs" class="btn top" aria-label="소리 켜고 끄기">♪</button>
  <button id="bh" class="btn top" aria-label="도움전화">☎</button>
  <div id="ov" class="ov" hidden></div>
</div>

<script>
(()=>{
'use strict';
const T=24, ROWS=15, VH=360, GY=12, COLS=216, WORLD=COLS*T;
const stage=document.getElementById('stage'), cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const ov=document.getElementById('ov');
let VW=720, rot=false, scale=1;

/* ---------- 화면 맞추기 (세로로 든 폰은 무대를 돌린다) ---------- */
function layout(){
  const w=innerWidth, h=innerHeight; rot=h>w;
  const sw=rot?h:w, sh=rot?w:h;
  stage.style.width=sw+'px'; stage.style.height=sh+'px';
  stage.style.transform=rot?'rotate(90deg) translate(0,-100%)':'none';
  VW=Math.max(480,Math.min(900,Math.round(VH*sw/sh)));
  const dpr=Math.min(2,window.devicePixelRatio||1);
  scale=sh/VH*dpr; cv.width=Math.round(VW*scale); cv.height=Math.round(VH*scale);
}
addEventListener('resize',layout); layout();

/* ---------- 그림 ---------- */
const img=(src)=>{const i=new Image(); i.src=src; return i;};
const BEAR=img('img/neulgom.webp'), CHICK=img('img/chick.webp');
let BEARG=null;
BEAR.onload=()=>{ try{ const c=document.createElement('canvas'); c.width=BEAR.width; c.height=BEAR.height; const x=c.getContext('2d'); x.drawImage(BEAR,0,0);
  const d=x.getImageData(0,0,c.width,c.height), a=d.data; for(let i=0;i<a.length;i+=4){ const g=a[i]*.3+a[i+1]*.59+a[i+2]*.11; a[i]=a[i+1]=a[i+2]=g*.75+50; } x.putImageData(d,0,0); BEARG=c; }catch(e){} };

/* ---------- 소리 ---------- */
let AC=null, sound=true;
function beep(f,d=.08,type='square',v=.05,slide=0){ if(!sound) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f; if(slide) o.frequency.linearRampToValueAtTime(f+slide,AC.currentTime+d);
  g.gain.value=v; g.gain.linearRampToValueAtTime(0,AC.currentTime+d); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+d+.02);}catch(e){} }

/* ---------- 스테이지 만들기 ---------- */
const grid=new Uint8Array(COLS*ROWS); const boxes={};
const at=(c,r)=> (c<0||c>=COLS)?1:(r<0||r>=ROWS)?0:grid[r*COLS+c];
const set=(c,r,v)=>{ if(c>=0&&c<COLS&&r>=0&&r<ROWS) grid[r*COLS+c]=v; };
const ground=(a,b)=>{ for(let c=a;c<=b;c++) for(let r=GY;r<ROWS;r++) set(c,r,1); };
const block=(a,b,r)=>{ for(let c=a;c<=b;c++) set(c,r,2); };
const box=(c,r,what)=>{ set(c,r,3); boxes[c+','+r]=what; };
const pad=(c)=> set(c,GY,5);
let coins,pieces,mungs,swarms,curtains,walls,flags,says,items,door;
function build(){
  grid.fill(0); for(const k in boxes) delete boxes[k];
  coins=[];pieces=[];mungs=[];swarms=[];curtains=[];walls=[];flags=[];says=[];items=[];
  const coin=(c,r)=>coins.push({x:c*T+12,y:r*T+12,got:false});
  const coinRow=(a,b,r)=>{ for(let c=a;c<=b;c++) coin(c,r); };
  const piece=(c,r)=>pieces.push({x:c*T+12,y:r*T+12,got:false});
  const mung=(a,b)=>mungs.push({x:a*T,y:GY*T-18,w:24,h:18,a:a*T,b:b*T,vx:32,alive:true});
  const swarm=(c)=>{ const s={hx:c*T,hy:GY*T-70,state:'idle',calm:0,bugs:[]}; for(let i=0;i<5;i++) s.bugs.push({x:s.hx+i*14-28,y:s.hy+(i%2)*16,ph:i*1.26}); swarms.push(s); };
  const curtain=(c)=>curtains.push({x:c*T,w:30,alive:true,hint:0});
  const wall=(c)=>walls.push({x:c*T,w:44,y:3*T,h:(GY-3)*T,alive:true});
  const say=(c,t)=>says.push({x:c*T,t,done:false});
  // 1구간: 익히기
  ground(0,34); say(3,'오른쪽으로 가라 삐약. 점프는 길게 누르면 높다 삐약.');
  coinRow(8,12,10); say(12,'머리 위 안개 상자를 머리로 쳐 봐라 삐약.');
  box(15,8,'coins'); box(17,8,'coins');
  say(20,'뭉치다 삐약. 위에서 밟거나 피해라 삐약.'); mung(23,31);
  ground(37,58); coinRow(35,36,8);
  block(41,43,9); coinRow(41,43,7); block(46,48,7); coinRow(46,48,5); piece(51,4);
  mung(50,57);
  // 2구간: 숨 바람
  ground(62,95); flags.push({x:64*T,on:false});
  say(66,'안개 장막이다 삐약. 숨 버튼을 꾹 눌렀다가 떼라 삐약.'); curtain(74);
  box(78,8,'shield'); mung(80,86); mung(85,91);
  say(89,'말랑 발판이다 삐약. 밟으면 높이 튄다 삐약.'); pad(93); piece(97,5);
  block(98,99,10); coinRow(98,99,8);
  // 3구간: 가만히 있기
  ground(102,140); say(104,'띵띵이 떼다 삐약. 쫓아오면 손을 떼고 가만히 있어라 삐약.');
  swarm(115); coinRow(108,111,10);
  mung(120,128); block(123,125,9); box(124,5,'coins');
  flags.push({x:132*T,on:false});
  // 4구간: 뛰어넘기
  ground(144,147); ground(151,153); block(156,158,10); coinRow(156,158,8); coin(142,8); coin(149,8);
  ground(160,215); say(161,'걱정 벽돌이다 삐약. 다가가서 기분에 이름을 붙여라 삐약.');
  wall(168); box(172,8,'coins');
  curtain(177); pad(180); block(183,185,6); piece(184,4); mung(182,189);
  swarm(196); coinRow(200,204,10);
  door={x:208*T,y:GY*T-52,w:36,h:52};
}

/* ---------- 상태 ---------- */
const K={l:false,r:false,j:false,b:false}; let jBuf=0;
let P, cam, maxX, cp, tNow, playT, running=false, paused=false, bonus=false, mood='sun';
let parts=[], gusts=[], clouds=[], bubble=null, msg=null, deaths=0, shake=0;
function reset(){
  build();
  P={x:2*T,y:GY*T-28,w:18,h:28,vx:0,vy:0,face:1,ground:false,coy:0,grey:0,inv:0,shield:bonus?1:0,coins:bonus?5:0,pcs:0,
     charge:0,charging:false,glide:false,jumpHeld:false,squash:0,airT:0};
  cam=0; maxX=P.x; cp={x:P.x,y:P.y}; tNow=0; playT=0; parts=[]; gusts=[]; clouds=[]; bubble=null; msg=null; deaths=0;
}

/* ---------- 조작 ---------- */
const kmap={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',Space:'j',KeyZ:'j',KeyW:'j',KeyX:'b',ShiftLeft:'b',ArrowDown:'b'};
addEventListener('keydown',e=>{ const k=kmap[e.code]; if(!k||!ov.hidden) return; e.preventDefault(); if(k==='j'&&!K.j) jBuf=.12; K[k]=true; });
addEventListener('keyup',e=>{ const k=kmap[e.code]; if(k) K[k]=false; });
function hold(el,key){ const dn=e=>{ e.preventDefault(); try{el.setPointerCapture(e.pointerId);}catch(_){}
    if(key==='j'&&!K.j) jBuf=.12; K[key]=true; el.classList.add('on'); };
  const up=()=>{ K[key]=false; el.classList.remove('on'); };
  el.addEventListener('pointerdown',dn); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); el.addEventListener('lostpointercapture',up); }
hold(document.getElementById('bj'),'j'); hold(document.getElementById('bb'),'b');
(()=>{ const el=document.getElementById('pad'), L=document.getElementById('pl'), R=document.getElementById('pr'); let id=null;
  const upd=e=>{ const r=el.getBoundingClientRect(); const x=rot?(e.clientY-r.top)/r.height:(e.clientX-r.left)/r.width;
    K.l=x<.46; K.r=x>.54; L.classList.toggle('on',K.l); R.classList.toggle('on',K.r); };
  const end=()=>{ id=null; K.l=K.r=false; L.classList.remove('on'); R.classList.remove('on'); el.classList.remove('on'); };
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); id=e.pointerId; try{el.setPointerCapture(id);}catch(_){} el.classList.add('on'); upd(e); });
  el.addEventListener('pointermove',e=>{ if(e.pointerId===id) upd(e); });
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end); el.addEventListener('lostpointercapture',end);
})();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('bs').onclick=()=>{ sound=!sound; document.getElementById('bs').textContent=sound?'♪':'×'; };
document.getElementById('bh').onclick=()=>helpCard();

/* ---------- 물리 ---------- */
const solidT=v=>v>=1&&v<=5;
function dynSolids(){ const a=[]; for(const c of curtains) if(c.alive) a.push({x:c.x,y:-200,w:c.w,h:GY*T+200,cur:c}); for(const w of walls) if(w.alive) a.push({x:w.x,y:-200,w:w.w,h:GY*T+200,wall:w}); return a; }
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function puff(x,y,n,col,sp=70){ for(let i=0;i<n;i++){ const a=Math.random()*6.28, s=sp*(.4+Math.random()); parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,t:.5+Math.random()*.4,col,r:2+Math.random()*3}); } }
function say(t,dur=4.2){ bubble={t,until:tNow+dur}; }
function note(t){ msg={t,until:tNow+1.6}; }
function addCoins(n,x,y){ P.coins+=n; for(let i=0;i<n;i++) parts.push({x:x+(i-(n-1)/2)*10,y,vx:(i-(n-1)/2)*30,vy:-190-Math.random()*40,t:.6,coin:true,hue:(i*70+tNow*90)%360,r:5,g:600}); beep(880,.07,'square',.04); setTimeout(()=>beep(1175,.09,'square',.04),70); }
function hurt(dir){
  if(P.inv>0) return;
  if(P.shield){ P.shield=0; P.inv=1.2; note('색 방패가 막았다'); puff(P.x+9,P.y+14,14,'#69b4e6'); beep(520,.12,'triangle',.06); return; }
  if(P.grey>0){ respawn(); return; }
  P.grey=4; P.inv=1.3; P.vx=-dir*150; P.vy=-200; shake=.25; note('안개에 물들었다. 잠깐 느려진다'); beep(180,.2,'sawtooth',.05,-80);
}
function respawn(){ deaths++; P.x=cp.x; P.y=cp.y; P.vx=P.vy=0; P.grey=0; P.inv=1.6; P.charge=0; P.charging=false; cam=Math.max(0,P.x-VW*.38); note('깃발에서 다시'); beep(200,.25,'triangle',.06,-100); }
function step(dt){
  tNow+=dt; playT+=dt;
  // 숨 모으기
  const wantB=K.b&&P.ground;
  if(wantB){ if(!P.charging){ P.charging=true; P.charge=0; } P.charge=Math.min(1,P.charge+dt/1.5); if(P.charge>=1&&!P.full){ P.full=true; beep(660,.1,'sine',.05); } }
  else if(P.charging){ P.charging=false; P.full=false; if(P.charge>.12){ gusts.push({x:P.x+9+P.face*12,y:P.y+12,dir:P.face,left:70+190*P.charge,pow:P.charge}); beep(300,.25,'sine',.06,400*P.charge); } P.charge=0; }
  // 좌우
  const maxV=P.grey>0?95:152; let ax=0;
  if(!P.charging){ if(K.l) ax-=1; if(K.r) ax+=1; }
  if(ax){ P.face=ax; const acc=P.ground?1000:640; P.vx+=ax*acc*dt; if(Math.sign(P.vx)!==ax) P.vx+=ax*acc*dt; }
  else { const f=(P.ground?1300:260)*dt; P.vx=Math.abs(P.vx)<=f?0:P.vx-Math.sign(P.vx)*f; }
  P.vx=Math.max(-maxV,Math.min(maxV,P.vx));
  // 점프
  jBuf-=dt; P.coy-=dt;
  if(jBuf>0&&P.coy>0&&!P.charging){ P.vy=-372; P.coy=0; jBuf=0; P.jumpHeld=true; P.glide=false; P.squash=-.18; beep(420,.1,'square',.04,260); }
  else if(jBuf>0&&!P.ground&&P.coy<=0&&P.vy>-80){ P.glide=true; jBuf=0; }
  if(!K.j){ if(P.jumpHeld&&P.vy<-150) P.vy=-150; P.jumpHeld=false; P.glide=false; }
  P.vy+=960*dt; if(P.glide&&P.vy>85) P.vy=85; if(P.vy>620) P.vy=620;
  // 가로 이동
  const dyn=dynSolids();
  P.x+=P.vx*dt;
  { const r0=Math.floor(P.y/T), r1=Math.floor((P.y+P.h-.01)/T);
    if(P.vx>0){ const c=Math.floor((P.x+P.w)/T); for(let r=r0;r<=r1;r++) if(solidT(at(c,r))){ P.x=c*T-P.w-.01; P.vx=0; break; } }
    else if(P.vx<0){ const c=Math.floor(P.x/T); for(let r=r0;r<=r1;r++) if(solidT(at(c,r))){ P.x=(c+1)*T+.01; P.vx=0; break; } }
    for(const d of dyn) if(hit(P,d)){ if(P.x+P.w/2<d.x+d.w/2) P.x=d.x-P.w-.01; else P.x=d.x+d.w+.01; P.vx=0;
      if(d.wall&&ov.hidden) worry(d.wall);
      if(d.cur&&tNow>d.cur.hint){ d.cur.hint=tNow+5; say('장막은 뛰어넘을 수 없다 삐약. 숨을 끝까지 모아서 불어라 삐약.'); } }
    if(P.x<0){ P.x=0; P.vx=0; } }
  // 세로 이동
  const wasG=P.ground; P.ground=false; P.y+=P.vy*dt;
  { const c0=Math.floor(P.x/T), c1=Math.floor((P.x+P.w-.01)/T);
    if(P.vy>=0){ const r=Math.floor((P.y+P.h)/T); for(let c=c0;c<=c1;c++){ const v=at(c,r); if(solidT(v)&&P.y+P.h-P.vy*dt<=r*T+1){
        P.y=r*T-P.h; if(v===5||at(c0,r)===5||at(c1,r)===5){ P.vy=-540; P.jumpHeld=false; P.squash=-.3; beep(300,.18,'sine',.06,500); puff(P.x+9,P.y+P.h,6,'#f4c7a1',50); }
        else { if(!wasG&&P.vy>200) P.squash=.22; P.vy=0; P.ground=true; } break; } } }
    else { const r=Math.floor(P.y/T); let best=-1,bd=1e9; for(let c=c0;c<=c1;c++) if(solidT(at(c,r))){ const d=Math.abs((c+.5)*T-(P.x+P.w/2)); if(d<bd){bd=d;best=c;} }
      if(best>=0){ P.y=(r+1)*T+.01; P.vy=40; if(at(best,r)===3) openBox(best,r); else beep(140,.05,'square',.03); } } }
  if(P.ground){ P.coy=.1; P.glide=false; P.airT=0; } else P.airT+=dt;
  if(P.y>VH+60){ respawn(); return; }
  P.grey=Math.max(0,P.grey-dt); P.inv=Math.max(0,P.inv-dt); P.squash*=Math.pow(.001,dt);
  if(P.x>maxX) maxX=P.x;
  const still=P.ground&&Math.abs(P.vx)<12;
  // 색 방울, 조각, 아이템
  for(const c of coins) if(!c.got&&Math.abs(c.x-P.x-9)<15&&Math.abs(c.y-P.y-14)<19){ c.got=true; P.coins++; beep(990,.06,'square',.035); puff(c.x,c.y,4,'#fff',40); }
