<style>
html,body{margin:0}
html,body,#stage,#stage *{touch-action:manipulation;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
/* 배치: 화면 전체가 픽셀 게임. 세로로 든 폰에서는 무대를 90도 돌려 가로로 눕혀서 하게 한다. 모집 포스터 색(주홍·크림·먹색·황토) 한 가지 모습. */
:root{
  --ink:#1f1b18; --paper:#f6ead0; --panel:#fff8e8;
  --red:#d9512c; --red-d:#a03a1c; --ocher:#c9993f; --sky:#69b4e6;
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--ink);font-family:var(--f-body);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#aeb4ba}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.btn{position:absolute;border:3px solid var(--ink);background:rgba(246,234,208,.55);color:var(--ink);
  font-family:var(--f-display);display:flex;align-items:center;justify-content:center;touch-action:none;
  box-shadow:0 4px 0 var(--ink);border-radius:6px}
.btn::before{content:"";position:absolute;inset:-10px}
.btn.on{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);background:var(--paper)}
#pad{left:max(12px,env(safe-area-inset-left,0px));bottom:12px;width:136px;height:60px;font-size:24px;justify-content:space-around}
#pad span{pointer-events:none;opacity:.75}
#pad span.on{color:var(--red);opacity:1}
#bj{right:max(12px,env(safe-area-inset-right,0px));bottom:12px;width:72px;height:66px;font-size:19px;background:rgba(217,81,44,.7);color:#fff8e8}
#bj.on{background:var(--red-d)}
#bb{right:calc(max(12px,env(safe-area-inset-right,0px)) + 84px);bottom:12px;width:58px;height:54px;font-size:17px}
.top{background:rgba(246,234,208,.88);top:7px;width:36px;height:34px;font-size:15px;box-shadow:0 3px 0 var(--ink);border-width:3px}
.top::before{inset:-5px}
#bh{right:max(10px,env(safe-area-inset-right,0px));z-index:6}
#bs,#bp{z-index:6}   /* ⚙ 설정과 🎒 배낭은 첫 화면·본부 카드 위에서도 누를 수 있게 */
#bp{right:calc(max(10px,env(safe-area-inset-right,0px)) + 138px)}
#hv{z-index:7}
#bs{right:calc(max(10px,env(safe-area-inset-right,0px)) + 46px)}
#bq{right:calc(max(10px,env(safe-area-inset-right,0px)) + 92px)}
#bq svg{display:block;pointer-events:none}
/* 라디오 앞에 서면 아래 가운데에 뜨는 「유튜브에서 듣기」 (양쪽 조작 버튼 사이) */
#yt{left:50%;bottom:14px;transform:translateX(-50%);height:44px;padding:0 14px;font-size:15px;text-decoration:none;white-space:nowrap;background:rgba(255,248,232,.94);touch-action:manipulation}
#yt b{color:var(--red-d);margin-right:6px}
#yt:active{transform:translateX(-50%) translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.ov button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.ov{position:absolute;inset:0;background:rgba(31,27,24,.62);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.card{background:var(--panel);border:4px solid var(--ink);border-radius:6px;box-shadow:0 6px 0 var(--ink);
  max-width:520px;width:100%;max-height:100%;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:11px}
.card h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
.card h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.ql{margin-left:-.3em}.qr{margin-right:-.3em}
.card p{margin:0;font-size:14.5px;line-height:1.55;text-wrap:pretty}
.card h2,.card p,.tel span{word-break:keep-all;overflow-wrap:anywhere}   /* 낱말 가운데서 줄이 바뀌지 않게 */
.card.opt{gap:9px}
/* 🎒 배낭 */
.card.bp{gap:8px;width:min(640px,100%)}
.tabs{display:flex;gap:6px}
.ov .tabs button.dk{flex:1;font-size:16px}
.bpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;max-height:min(210px,calc(100vh - 170px));overflow:auto;padding:2px 2px 6px}
.it{border:3px solid var(--ink);border-radius:6px;background:var(--paper);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;text-align:center}
.it canvas{image-rendering:pixelated;width:72px;height:56px}
.it b{font-family:var(--f-display);font-weight:400;font-size:15px;line-height:1.1}
.it small{font-size:12px;color:#5d5850}
.ov .it button.dk{padding:4px 8px;font-size:14px}
.it.on{background:var(--ink);color:var(--panel)} .it.on canvas{background:var(--paper);border-radius:4px} .it.on small{color:#d6c198}
.wal{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-size:26px} .wal small{font-family:var(--f-body);font-size:13px}
@media (max-height:340px){ .bpl{max-height:132px} .it canvas{width:54px;height:42px} .card.bp .eyebrow{display:none} }
.orow{display:flex;align-items:center;gap:10px}
.orow>span{flex:none;width:5.2em;font-size:14px;font-weight:700}
.seg{display:flex;gap:6px;flex:1}
.ov .seg button.dk{flex:1;padding:6px 2px;font-size:15px}
@media (max-height:300px){ .card.opt{gap:5px} .ov .seg button.dk{padding:3px 2px} }
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--red-d);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px}
.ov button{font-family:var(--f-display);font-size:18px;border:3px solid var(--ink);border-radius:6px;background:var(--paper);
  color:var(--ink);padding:10px 14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;flex:1 1 auto;min-width:0}
.ov button.go{background:var(--red);color:#fff8e8;font-size:22px;padding:12px 18px}
.ov button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.note{font-size:12.5px;color:#5c5348}
.hqtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hqr{display:flex;align-items:center;gap:10px;margin-left:auto}
.agc{display:flex;align-items:baseline;gap:8px;padding:5px 12px;border:3px solid var(--ink);border-radius:6px;background:var(--ocher);box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.agc small{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink)}
.agc b{font-family:var(--f-body);font-weight:800;font-size:19px;line-height:1;color:var(--ink);letter-spacing:.02em}
.agc .lnk{margin:-10px -8px -10px 2px;color:var(--ink)}
.hqr .lnk{white-space:nowrap}
@media (max-width:760px){ .hqtop{padding-right:40px} }   /* 좁은 화면에서는 오른쪽 위 ☎ 버튼이 카드 모서리에 걸친다 (☎는 카드 위에서도 늘 누를 수 있게 둔다). 카드 첫 줄의 버튼이 ☎ 밑으로 들어가지 않게 비워 둔다 */   /* 좁은 화면에서는 오른쪽 위 ☎ 버튼이 카드 모서리에 걸친다 (폭 720~760에서는 글씨 단추 끝이 ☎에 닿거나 바짝 붙는다) */
.raid{display:flex;align-items:center;gap:6px;font-size:12px;color:#5c5348;font-variant-numeric:tabular-nums}
.raid i{display:block;width:84px;height:9px;border:2px solid var(--ink);background:#fff}
.raid b{display:block;height:100%;width:0;background:var(--red)}
.card p.ntc{font-size:13px;line-height:1.35;border-left:4px solid var(--ocher);padding-left:8px}
.song{display:inline-block}   /* 추천곡 한 줄은 낱말 가운데서 끊기지 않고 통째로 다음 줄로 넘어간다 */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.days button{display:flex;flex-direction:column;gap:3px;align-items:center;padding:9px 4px;font-size:15px}
.days small{font-family:var(--f-body);font-size:11px;color:#5c5348}
.days b{font-weight:400;line-height:1.15;text-wrap:balance}
.days span{font-family:var(--f-body);font-size:11px;color:var(--red-d);min-height:14px}
.days button:disabled{opacity:.7;box-shadow:none;border-color:#9a8f80;color:#6d645a}
.days button:disabled span{color:#7a3a22}
/* 감정 벽: 낱말 여섯 개를 세 칸 두 줄로. 누른 낱말은 먹색으로 뒤집히고, 아래 줄에 뜻이 보인다 (뜻 줄은 두 줄 높이를 미리 잡아 둬서 카드가 들썩이지 않는다) */
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ov .feel button{font-size:17px;padding:9px 4px}
.ov .feel button.on,.ov button.dk.on{background:var(--ink);color:var(--panel)}
.ov button.dk{flex:none;font-size:15px;padding:5px 12px;box-shadow:0 3px 0 var(--ink)}
.card p.fm{min-height:3.1em;margin:6px 0 4px}
.fm b{font-family:var(--f-display);font-weight:400;font-size:17px}
.ov button.go:disabled{opacity:.45;box-shadow:none}
.wx{position:relative;border:3px solid var(--ink);overflow:hidden;touch-action:none}
.wxagain{position:absolute;right:8px;bottom:8px;font-size:13px;padding:6px 10px}
.wxrow{align-items:center;justify-content:space-between;flex-wrap:nowrap}
.wxrow .note{margin:0;text-align:left}
.tpick{display:flex;gap:6px;flex:0 0 auto}
.ov.flat .tpick{flex-wrap:wrap}   /* 폭 280px 화면에서 단추 두 개가 카드 밖으로 나가지 않게 */
.ov .tpick button{flex:0 0 auto;font-size:15px;padding:5px 10px;box-shadow:0 3px 0 var(--ink)}
.ov .tpick button.on{background:var(--ink);color:var(--panel)}
.ov .tpick button.off{border-style:dashed;color:#7d7264}
.ov .tpick button.on.off{color:var(--panel)}
.tlock{position:absolute;left:50%;top:50%;height:78%;max-width:70%;transform:translate(-50%,-50%);opacity:.22;pointer-events:none;image-rendering:pixelated}
.tlockt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:6px 12px;border:2px solid #2a2622;border-radius:6px;background:#fff8ea;color:#2a2622;font-weight:700;font-size:14px;white-space:nowrap;pointer-events:none}
.card.wide{max-width:640px;gap:9px;padding:13px 18px}
.card.wide h1{font-size:25px}
/* 키가 낮은 화면(가로로 눕힌 작은 폰, 주소창이 보이는 사파리)에서는 넓은 카드를 조금 조여 「본부로」 버튼까지 한 화면에 들어오게 한다.
   세로로 든 폰은 화면을 돌려서 보여 주므로 폭이 곧 키다 */
@media (max-height:380px), (orientation:portrait) and (max-width:380px){ .card.wide{padding:10px 16px;gap:7px} .card.wide .order{padding:6px 12px} .card.wide .stat div{padding:4px 6px} .ov .card.wide button.go{padding:9px 18px}
  .card.wide h2{font-size:20px} .ov .feel button{font-size:16px;padding:7px 4px} .card p.fm{font-size:13.5px;min-height:3em} }
/* 키가 300px도 안 되는 화면(주소창이 보이는 안드로이드 가로 화면, 폭이 아주 좁은 폰)에서는 한 번 더 조인다 */
@media (max-height:300px), (orientation:portrait) and (max-width:300px){ .card.wide{padding:8px 14px;gap:6px} .ov .feel{gap:6px} .ov .feel button{padding:5px 4px} }
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat div{border:3px solid var(--ink);border-radius:4px;padding:6px 6px;text-align:center;background:var(--paper);font-size:12px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
@media (max-height:300px){ .card.sn>.eyebrow{display:none} }
.rk{list-style:none;margin:0;padding:0;display:grid;grid-template-rows:repeat(5,auto);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px 16px;font-size:14px}
.rk li{display:flex;gap:8px;align-items:baseline;border-bottom:2px dotted #d8ccb4;padding:3px 6px;min-width:0}
.rk li b{min-width:2.4em;font-family:var(--f-display);font-weight:400}
.rk li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk li i{font-style:normal;font-weight:700}
.rk li.me{background:#ffe3d6;border-radius:3px}
.rk li.wait{grid-row:1;border:0;color:#5c5348}
.card.big .rk{font-size:15.5px} .card.big h1{font-size:36px}
/* 키가 낮은 화면(세로로 든 폰은 무대를 돌려 눕히므로 폭이 곧 높이): 목록을 촘촘하게, 규칙 안내 줄은 뺀다 */
@media (max-height:400px), (orientation:portrait) and (max-width:440px){ .rk{font-size:13px;gap:0 14px} .rk li{padding:1px 6px} #rnt{display:none} .card.big h1{font-size:30px} }
@media (max-height:300px), (orientation:portrait) and (max-width:330px){ .card.rkc>.eyebrow{display:none} }
.order{border:3px dashed var(--ink);border-radius:4px;padding:10px 12px;background:#fff}
/* 오류·의견 보내기: 글씨만 있는 작은 버튼으로 열고, 카드는 돌려 놓은 무대 밖에 똑바로 띄운다 (폰을 세워 잡고 글을 쓸 수 있게).
   글씨 버튼은 보이는 크기는 그대로 두고 손가락으로 누르는 넓이만 키운다 (안쪽 여백을 주고 같은 만큼 바깥 여백을 뺀다) */
.ov button.lnk{flex:none;border:0;box-shadow:none;background:none;padding:10px 8px;margin:-10px -8px;font:700 12.5px var(--f-body);color:var(--red-d);text-decoration:underline;text-underline-offset:2px}
.ov button.lnk:active{transform:none;box-shadow:none}
.ov.flat{position:fixed;inset:0;z-index:9;background:var(--ink);align-items:flex-start;overflow:auto;
  padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));
  /* 아래 여백은 안쪽 여백이 아니라 테두리로 둔다: 밀리는 영역이 거기서 끝나서, 아래에 붙은 단추 줄 밑으로 카드 글이 비치지 않는다 */
  border-bottom:14px solid transparent}
.ov.flat,.ov.flat *{touch-action:manipulation}
.ov.flat .card{max-height:none;overflow:visible;margin:auto 0}   /* 카드 안이 아니라 화면 전체(#hv)가 밀린다. 그래야 아래 단추 줄이 화면 아래에 붙는다 */
.ov.flat textarea{display:block;width:100%;box-sizing:border-box;font:16px/1.5 var(--f-body);border:3px solid var(--ink);border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink);
  resize:none;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.ov.flat textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.fb2,.fb2>div{display:flex;flex-direction:column;gap:11px;min-width:0}
.skyl{list-style:none;margin:0;padding:8px 10px;max-height:9.5em;overflow:auto;border-radius:6px;background:linear-gradient(#7fc3ee,#d6ecf5);display:flex;flex-direction:column;gap:5px}
.skyl li{align-self:flex-start;background:#fff;color:#1f1b18;border:2px solid #1f1b18;border-radius:10px;padding:2px 9px;font-size:14px;line-height:1.4;word-break:break-all}
.skyl li:nth-child(even){align-self:flex-end}
.skyl li.wait{background:none;border:0;color:#1f1b18;align-self:stretch}
@supports (display:contents){ .fb2,.fb2>div{display:contents} }   /* 한 칸일 때는 칸 틀을 없앤다. 그래야 아래 단추 줄이 카드 어디에서든 화면 아래에 붙는다 */
/* 화면이 낮아 카드가 넘쳐도 아래 단추 줄(보내기, 닫기)은 늘 보이게 화면 아래에 붙여 둔다 */
.ov.flat .card>.row:last-child,.ov.flat .fb2 .row{position:sticky;bottom:0;z-index:1;background:var(--panel);padding:6px 0 5px;margin:-6px 0 -5px}
/* 가로로 눕힌 키 낮은 폰: 글 칸과 안내·단추를 두 칸으로 나눠 「보내기」까지 한 화면에 들어오게 하고, 도움전화 네 줄은 두 줄로 놓는다.
   폭 480px 아래는 뺀다 (세로로 든 폰에서 자판이 올라와 화면이 낮아진 경우. 그때는 한 칸 그대로 둔다) */
@media (orientation:landscape) and (max-height:430px) and (min-width:480px){
  .ov.flat .card{max-width:720px;padding:10px 16px;gap:7px} .ov.flat .card h2{font-size:19px}
  .ov.flat .card p{font-size:13.5px;line-height:1.45} .ov.flat .card p.note{font-size:12px;line-height:1.4}
  .fb2{display:flex;flex-direction:row;gap:14px} .fb2>div{display:flex;flex:1 1 0;gap:7px} .fb2>div:first-child{flex-grow:1.25}
  .ov.flat .fb2 textarea{flex:1 1 auto;min-height:4.7em}
  .ov.flat .card button.go{font-size:19px;padding:8px 14px}
  .ov.flat .tel{grid-template-columns:auto 1fr auto 1fr;gap:3px 10px;font-size:13px} .ov.flat .tel b,.ov.flat .tel>a{font-size:16px}
}
/* 키가 300px도 안 되는 가로 화면(주소창이 보이는 폰): 위아래 여백을 더 줄이고 작은 머리글을 뺀다. 도움전화 카드의 마지막 안내 줄까지 한 화면에 들어온다 */
@media (orientation:landscape) and (max-height:300px) and (min-width:480px){
  .ov.flat{padding-top:6px;border-bottom-width:6px} .ov.flat .card{padding:8px 16px;gap:5px} .ov.flat .card .eyebrow{display:none}

const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function dynSolids(){ const a=[]; for(const c of curtains) if(c.alive) a.push({x:c.x,y:-300,w:c.w,h:GTOP+300,cur:c}); for(const w of walls) if(w.alive) a.push({x:w.x,y:-300,w:w.w,h:GTOP+300,wall:w}); return a; }
function puff(x,y,n,col,sp=45,s=2){ for(let i=0;i<n;i++){ const a=Math.random()*6.28, v=sp*(.4+Math.random()); const t=.3+Math.random()*.3; parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,t,T0:t,col,s,g:120}); } }
function dust(x,y,dir){ for(let i=0;i<3;i++){ const t=.25+Math.random()*.15; parts.push({x:x+(Math.random()-.5)*6,y:y-1,vx:-dir*(10+Math.random()*25),vy:-8-Math.random()*14,t,T0:t,col:'#efe6d2',s:2,g:20}); } }
/* 숨 고르기: 4초 들이쉬고 6초 내쉬기를 세 번. 배경음악은 멈추고 내쉴 때마다 싱잉볼이 울린다.
   끝까지 하면 하루 한 번 색 방울 3개(완료 카드의 「깊은 숨」에 셈). 움직이면 그만둔다. 숨 고르는 시간은 걸린 시간에 넣지 않는다 */
const MED_IN=4, MED_OUT=6, MED_N=3, MED_T=MED_IN+MED_OUT;
function medStart(){ med={t:0,n:-1}; cush.lock=true; P.vx=P.vy=0; P.x=cush.x+cush.w/2-6; P.y=GTOP-P.h; P.ground=true; P.glide=false; P.charging=false; P.charge=0; K.j=false; jBuf=0; }
function medStep(dt){ playT-=dt; med.t+=dt;
  if(med.t>.8&&(K.l||K.r||K.j)){ med=null; return; }
  const n=Math.floor((med.t-MED_IN)/MED_T); if(n>med.n&&n<MED_N&&med.t>=MED_IN){ med.n=n; bowl(); }   // 내쉬기가 시작될 때 울린다
  if(med.t>=MED_N*MED_T){ med=null; care.b++;
    const sv=loadSave(), first=sv.cush!==today();
    if(first&&!teacher()){ sv.cush=today(); putSave(sv); }
    if(first){ for(let i=0;i<3;i++) popCoin(P.x+6+(i-1)*9,P.y-16,i+1); note('숨 고르기 끝. 색 방울 3개'); } else note('숨 고르기 끝'); } }
function say(t,dur=4.6,min=1.6){ if(bubble&&bubble.t===t){ bubble.until=tNow+dur; return; } bq=bq.filter(q=>q.t!==t); bq.push({t,dur,min}); if(bq.length>2) bq.shift(); }
function note(t){ msg={t,until:tNow+1.7}; }
function popCoin(x,y,h){ P.coins++; parts.push({pop:true,x:x-4,y:y-10,vx:0,vy:-175,t:.42,T0:.42,h:(h||0)%4,g:520}); SFX.coin(); }
function hurt(dir,bm){   // bm: 보스가 내보낸 뭉치에 맞았다

  if(P.coat){ P.coat=false; P.inv=1.4; P.vx=-dir*70; P.vy=-120; shake=.15; note('주홍 코트가 대신 맞았다'); puff(P.x+6,P.y+11,14,'#d9512c',70); tone(360,.16,'triangle',.06,-120); return; }

  // 같은 겹에서 세 번째 물들면 병아리가 귀띔하고, 여섯 번째에는 한 겹 걷어 주겠다고 묻는다
  if(bm&&bossC&&bossC.alive){ const b=bossC; b.hits=(b.hits||0)+1;
    if(b.hits>=6){ b.hits=0; offerLift('hit'); }
    else if(b.hits===3){ b.hint=tNow+6; say('뭉치 떼는 뛰어넘어라. 떼가 지나가면 장막이 눈을 감는다 삐약.'); } }
}
function respawn(){ deaths++; P.x=cp.x; P.y=cp.y; P.vx=P.vy=0; P.grey=0; P.coat=false; P.inv=1.6; P.charge=0; P.charging=false; P.glide=false; cam=Math.max(0,Math.min(LW-W,P.x-W*.36)); note('깃발에서 다시'); SFX.die();
  // 되살아나면 보스의 떼도 처음부터 다시 나온다 (남아 있던 뭉치가 깃발까지 걸어와서 가만히 선 곰을 치지 않게)
  if(bossC&&bossC.alive){ for(const m of mungs) if(m.tmp&&m.alive&&m.sq<=0){ m.alive=false; clouds.push({x:m.x+8,y:m.y+6,a:0}); } bossC.i=0; bossC.cd=.8; bossC.nap=false; bossC.blk=bossC.wk=bossC.hits=0; }
  if(++stuck>=3&&!room) offerLift(); }
function bumpTop(c,r){ for(const m of mungs) if(m.alive&&m.sq<=0&&Math.abs(m.y+m.h-r*T)<3&&m.x+m.w>c*T&&m.x<(c+1)*T) popMung(m,true); }
function headHit(c,r){ const v=at(c,r), key=c+','+r;
  if(v===3){ const b=boxes[key]; bumps[key]=tNow; bumpTop(c,r);
    if(b.what==='shield'||b.what==='coat'){ items.push({kind:b.what,x:c*T+8,y:r*T-6,y0:r*T-6,vx:0,vy:0,state:'rise',t:0,got:false}); SFX.item(); b.n=0; }
    else { popCoin(c*T+8,r*T,(c+b.n)%4); b.n--; }
    if(b.n<=0) set(c,r,4); SFX.bump(); }
  else if(v===6){ set(c,r,0); bumpTop(c,r); SFX.brk(); for(let i=0;i<4;i++) parts.push({deb:true,x:c*T+(i%2)*8,y:r*T+(i>>1)*8,vx:(i%2?1:-1)*(40+Math.random()*30),vy:-150-(i>>1?0:60),t:.8,T0:.8,g:700,sx:(i%2)*8,sy:(i>>1)*8}); }
  else { if(v===4||v===2) bumps[key]=tNow-.08; SFX.bump(); }
}
// 장막에 끝까지 모은 숨 바람이 닿았을 때. 보스 장막은 한 겹씩 걷히며 뒤로 물러나고, 보통 장막과 보스의 마지막 겹은 한 번에 걷힌다
// 보스 장막의 마지막 한 겹 앞에서는 숨이 천천히(4초) 모인다. 판마다 한 번은 버튼이 아니라 진짜 숨을 쉬어 보게 하려는 것이다
const deep=()=>!!(bossC&&bossC.alive&&bossC.hp===1&&bossC.x>=bossC.tx&&bossC.x>P.x&&bossC.x-P.x<236);
function blow(c){
  if(c.boss&&c.hp>1){ c.hp--; c.w=14+c.hp*8; c.tx=Math.max(c.x,c.tx)+22*T; c.cd=.8; c.i=0; c.nap=false; c.blk=c.wk=c.hits=0; shake=.25; freeze=.06; for(let i=0;i<26;i++) puff(c.x+10,GTOP-Math.random()*150,1,'#c9cfd5',90,2);
    for(const m of mungs) if(m.tmp&&m.alive&&m.sq<=0) popMung(m,true); note(c.hp===2?'한 겹 걷혔다. 장막이 물러난다':'이제 한 겹 남았다'); SFX.calm();
    if(c.hp===1) say('마지막 겹이다. 이번에는 숨이 천천히 모인다. 고리가 차는 동안 너도 같이 숨을 들이쉬어라 삐약.',7); }
  else { c.alive=false; for(let i=0;i<34;i++) puff(c.x+10,GTOP-Math.random()*150,1,'#c9cfd5',80,2); for(let i=0;i<(c.boss?6:2);i++) popCoin(c.x+6+i*9,GTOP-40,i+2);
    if(c.boss){ for(const m of mungs) if(m.tmp&&m.alive&&m.sq<=0) popMung(m,true); shake=.3; say('「회색 장막」이 걷혔다. 본부 문이 보인다 삐약.'); } note(c.boss?'「회색 장막」이 걷혔다':'안개 장막이 걷혔다'); SFX.calm(); } }
function popMung(m,flung){ m.sq=flung?.01:.32; m.vx=0; popCoin(m.x+8,m.y,1); SFX.stomp(); puff(m.x+8,m.y+8,6,'#ffffff',40); }
function step(dt){
  tNow+=dt; playT+=dt;
  if(freeze>0){ freeze-=dt; return; }
  if(warp){ warpStep(dt); return; }
  if(lift){ liftStep(dt); return; }
  if(med){ medStep(dt); return; }
  // 주홍 코트를 입었으면 숨 버튼을 톡 눌러 짧은 바람을 쏜다 (길게 누르면 평소처럼 모은다)
  P.puffCd-=dt; P.bHold=K.b?P.bHold+dt:0;
  if(K.b&&!prevB&&P.coat&&P.puffCd<=0){ gusts.push({x:P.x+6+P.face*8,y:P.y+9,dir:P.face,left:84,pow:.3,puff:true}); P.puffCd=.38; SFX.gust(.3); } prevB=K.b;
  // 숨 모으기
  const wantB=K.b&&P.ground&&(!P.coat||P.bHold>.16);
  if(wantB){ if(!P.charging){ P.charging=true; P.charge=0; P.full=false; } P.charge=Math.min(1,P.charge+dt/(deep()?4:1.5)); if(P.charge>=1&&!P.full){ P.full=true; SFX.full(); } }
  else if(P.charging){ P.charging=false; if(P.charge>.12){ gusts.push({x:P.x+6+P.face*8,y:P.y+9,dir:P.face,left:46+128*P.charge,pow:P.charge}); SFX.gust(P.charge); if(P.charge>=1) care.b++; } P.charge=0; }
  // 좌우
  const maxV=P.grey>0?66:MAXV; let ax=0;
  if(!P.charging){ if(K.l) ax-=1; if(K.r) ax+=1; }
  if(ax){ P.face=ax; const acc=P.ground?ACC_G:ACC_A; if(P.vx*ax<0){ P.vx+=ax*acc*1.9*dt; if(P.ground&&Math.abs(P.vx)>40&&Math.random()<.3) dust(P.x+6,P.y+P.h,-ax); } else P.vx+=ax*acc*dt; }
  else { const f=(P.ground?FRIC:200)*dt; P.vx=Math.abs(P.vx)<=f?0:P.vx-Math.sign(P.vx)*f; }
  P.vx=Math.max(-maxV,Math.min(maxV,P.vx));
  // 점프
  jBuf-=dt; P.coy-=dt;
  if(jBuf>0&&P.coy>0&&!P.charging){ P.vy=JUMP; P.coy=0; jBuf=0; P.jumpHeld=true; P.glide=false; P.boost=false; SFX.jump(); dust(P.x+6,P.y+P.h,P.face); }
  else if(jBuf>0&&!P.ground&&P.coy<=0&&P.vy>-40&&P.airT>.12) P.glide=true;
  if(!K.j){ P.jumpHeld=false; P.glide=false; }
  P.vy+=(P.vy<0?((P.jumpHeld||P.boost)?G_UP:G_REL):G_FALL)*dt; if(P.vy>=0) P.boost=false;
  if(P.glide&&P.vy>GLIDE_VY) P.vy=GLIDE_VY; if(P.vy>VY_MAX) P.vy=VY_MAX;
  // 가로
  const dyn=dynSolids();
  P.x+=P.vx*dt;
  { const r0=Math.floor(P.y/T), r1=Math.floor((P.y+P.h-.01)/T);
    if(P.vx>0){ const c=Math.floor((P.x+P.w)/T); for(let r=r0;r<=r1;r++) if(solidT(at(c,r))){ P.x=c*T-P.w-.01; P.vx=0; break; } }
    else if(P.vx<0){ const c=Math.floor(P.x/T); for(let r=r0;r<=r1;r++) if(solidT(at(c,r))){ P.x=(c+1)*T+.01; P.vx=0; break; } }
    for(const d of dyn) if(hit(P,d)){ if(P.x+P.w/2<d.x+d.w/2) P.x=d.x-P.w-.01; else P.x=d.x+d.w+.01; P.vx=0;
      if(d.wall&&ov.hidden) feel(d.wall);
      if(d.cur&&tNow>d.cur.hint){ d.cur.hint=tNow+6; say('장막은 넘을 수 없다. 숨을 끝까지 모아서 불어라 삐약.'); } } }
  // 세로
  const wasG=P.ground, vy0=P.vy; P.ground=false; P.y+=P.vy*dt;
  { const c0=Math.floor(P.x/T), c1=Math.floor((P.x+P.w-.01)/T);
    if(P.vy>=0){ const r=Math.floor((P.y+P.h)/T); let land=false, padC=-1; for(let c=c0;c<=c1;c++){ const v=at(c,r); if(solidT(v)&&P.y+P.h-P.vy*dt<=r*T+1.5){ land=true; if(v===5) padC=c; } }
      if(land){ P.y=r*T-P.h; if(padC>=0){ P.vy=PADV; P.boost=true; P.jumpHeld=false; padT[padC]=tNow; SFX.pad(); puff(P.x+6,P.y+P.h,6,'#f7c9a8',40); }
        else { if(!wasG&&vy0>150) dust(P.x+6,P.y+P.h,0); P.vy=0; P.ground=true; } } }
    else { const r=Math.floor(P.y/T); const sol=[]; for(let c=c0;c<=c1;c++) if(solidT(at(c,r))) sol.push(c);
      if(sol.length){ let nudged=false;
        if(sol.length===1&&c0!==c1){ const c=sol[0], o=c===c0?(c0+1)*T-P.x:P.x+P.w-c*T; if(o<=4){ P.x+=c===c0?o+.01:-o-.01; nudged=true; } }
        if(!nudged){ let best=sol[0],bd=1e9; for(const c of sol){ const d=Math.abs((c+.5)*T-(P.x+P.w/2)); if(d<bd){bd=d;best=c;} }
          P.y=(r+1)*T+.01; P.vy=30; P.jumpHeld=false; headHit(best,r); } } } }
  if(P.ground){ P.coy=.1; P.glide=false; P.airT=0; if(Math.abs(P.vx)>8) P.runT+=dt*Math.abs(P.vx)/MAXV; } else P.airT+=dt;
  // 명상 방석 (금주의 표어 왼쪽): 제자리에서 뛰어 방석 위로 내려앉으면 가부좌로 앉아 숨을 고른다
  if(cush&&!room){ const on=Math.abs(P.x+6-(cush.x+cush.w/2))<12;

  if(!room&&P.x>door.x+door.w-P.w-2){ P.x=door.x+door.w-P.w-2; if(P.vx>0) P.vx=0; }
  if(P.x>maxX&&!room) maxX=P.x;

  for(const p of pieces) if(!p.got&&Math.abs(p.x-P.x-6)<12&&Math.abs(p.y-P.y-11)<16){ p.got=true; P.pcs++; note('숨은 색 조각 '+P.pcs+'/3'); puff(p.x,p.y,16,'#d9512c',70); SFX.item(); }
  if(post&&room&&room.kind==='top'){ const over=P.x+P.w>post.x-2&&P.x<post.x+post.w+2&&P.y<post.y+post.h&&P.y+P.h>post.y-4;
    if(over&&!post.busy){ post.busy=true; SFX.item(); puff(post.x+8,post.y,10,'#ffffff',50); skyCard(); }
    else if(!over&&post.busy&&Math.abs(P.x-post.x)>40) post.busy=false; }   // 한 번 열면 멀어졌다가 다시 와야 또 열린다
  if(post&&!room&&!warp&&P.y+P.h<-4&&Math.abs(P.x-post.pc*T)<5*T) enterTop();   // 두 단 발판의 말랑 발판에서 화면 위로 튀어 오르면 구름 위 하늘로
  for(const it of items){ if(it.got) continue;
    if(it.state==='rise'){ it.t+=dt; it.y=it.y0-Math.min(1,it.t/.45)*11; if(it.t>.6){ it.state='move'; it.vx=30; } }
    else { it.t+=dt; it.vy+=620*dt; it.x+=it.vx*dt; const cc=Math.floor((it.x+(it.vx>0?6:-6))/T), rr=Math.floor(it.y/T); if(solidT(at(cc,rr))) it.vx=-it.vx;
      it.y+=it.vy*dt; const r=Math.floor((it.y+6)/T), c=Math.floor(it.x/T); if(it.vy>0&&solidT(at(c,r))){ it.y=r*T-6; it.vy=0; } if(it.y>WH+30) it.got=true; }
    if(Math.abs(it.x-P.x-6)<12&&Math.abs(it.y-P.y-11)<16&&it.t>.3){ it.got=true; SFX.item();
      if(it.kind==='coat'){ P.coat=true; P.grey=0; freeze=.12; note('주홍 코트를 입었다'); puff(P.x+6,P.y+11,18,'#d9512c',80); say('주홍 코트다. 숨 버튼을 톡 누르면 바람이 나간다 삐약.'); }

  // 깃발, 말풍선
  if(!room) for(const f of flags) if(!f.on&&P.x>f.x){ f.on=true; cp={x:f.x,y:GTOP-P.h}; stuck=0; if(bossC) bossC.blk=bossC.wk=bossC.hits=0; note('깃발! 여기서 이어 한다'); puff(f.x+8,GTOP-30,14,'#d9512c',60); SFX.flag(); }

  if(bubble&&tNow>=bubble.until) bubble=null;

    else if(b.x>P.x&&b.x-P.x<236&&!room){ if(!swarms.some(s=>s.state==='alert')) b.cd-=dt;

          mungs.push({x:b.x-17,y:GTOP-14,w:16,h:14,a,b:b.x,vx:-wv.v,vy:0,alive:true,sq:0,tmp:true}); puff(b.x-6,GTOP-8,6,'#c9cfd5',40); }
        if(++b.i<wv.t.length) b.cd+=wv.t[b.i]-wv.t[b.i-1]; else { b.i=0; b.cd=wv.rest; b.nap=true; } } } }

   이름이나 반은 받지 않는다. 같은 폰의 기록을 서버에서 이어 붙이려고 아무 뜻 없는 기록 번호(id)를 함께 만든다.
   순위: 판을 깰 때마다 {기록 번호, 코드, 판별 최고 방울 수}를 서버에 보낸다. 서버는 판별 큰 쪽만 남겨 그 합으로 순위를 매기고
   (같은 판을 되풀이해서 쌓이지 않게), 코드가 다른 기록과 겹치면 비어 있는 코드로 바꿔 돌려준다.
   본부 주소(config.js)가 없으면 순위표는 나오지 않는다. 선생님 모드에서는 기록 없이 순위만 본다 */
const CODE_C=['파란','하늘','초록','연두','노란','주황','빨간','분홍','보라','남색','하얀','까만','회색','은빛','금빛','민트','살구','밤색','청록','무지개'];
const CODE_A=['돌고래','수달','너구리','고슴도치','펭귄','올빼미','다람쥐','여우','판다','코알라','거북이','고래','해달','참새','두루미','호랑이','사슴','토끼','물개','카멜레온','나무늘보','미어캣','라쿤','부엉이','치타','늑대','까치','문어','도마뱀','햄스터'];
const newCode=()=>CODE_C[Math.floor(Math.random()*CODE_C.length)]+CODE_A[Math.floor(Math.random()*CODE_A.length)];
function agent(){ const sv=loadSave(), a=sv.agent;
  if(a&&typeof a==='object'&&/^[a-z0-9]{16}$/.test(a.id)&&typeof a.code==='string'&&/^[가-힣0-9]{3,12}$/.test(a.code)) return a;
  let id=''; try{ const u=new Uint8Array(16); crypto.getRandomValues(u); u.forEach(x=>id+=(x%36).toString(36)); }catch(e){ while(id.length<16) id+=Math.floor(Math.random()*36).toString(36); }
  sv.agent={id,code:newCode(),fixed:false}; putSave(sv); return sv.agent; }
const rankShow=()=>FB_ON&&(teacher()||!!agent().fixed);
let rankDue=false, RK=null;
function rankSend(){ const a=agent(), sv=loadSave(), best={};
  for(const k in (sv.best||{})) if(/^\d{1,2}$/.test(k)) best[k]=Math.max(0,Math.floor(+sv.best[k])||0);
  const body=JSON.stringify(teacher()?{a:'rank',view:1}:{a:'rank',id:a.id,code:a.code,best});
  const p=Promise.race([fetch(FB_URL,{method:'POST',body,headers:{'Content-Type':'text/plain;charset=utf-8'}}).then(r=>r.json()).catch(()=>null),new Promise(r=>setTimeout(()=>r(null),12000))])
    .then(j=>{ if(j&&j.ok&&!teacher()&&typeof j.code==='string'&&/^[가-힣0-9]{3,14}$/.test(j.code)&&j.code!==a.code){ const s2=loadSave(); s2.agent=Object.assign({},agent(),{code:j.code}); putSave(s2); } return j; });
  RK={t:Date.now(),p}; return p; }
// final = 마지막 판을 깼을 때 크게 보여 주는 최종 순위표 (DAYS에 final:true인 판)
function rankCard(final){ rankDue=false;
  card(`<div class="eyebrow">${final?'작전 끝 · 최종 순위':'요원 순위 · 색 방울'}</div><h1>${final?'최종 순위':'순위표'}</h1>
  <ol class="rk" id="rk"><li class="wait">순위표를 불러오는 중이에요.</li></ol>
  <p id="rme" hidden></p>
  <p class="note" id="rnt">판마다 가장 많이 모은 색 방울을 더한 순위예요.</p>
  <div class="row"><button class="go" id="r1">본부로</button></div>`);
  ov.firstChild.classList.add('wide','rkc'); if(final) ov.firstChild.classList.add('big'); on('r1',()=>{ SFX.tick(); hqCard(); });
  const box=ov.firstChild, p=(RK&&Date.now()-RK.t<30000)?RK.p:rankSend();
  p.then(j=>{ if(ov.firstChild!==box) return;   // 그 사이에 다른 카드로 넘어갔다
    const ol=box.querySelector('#rk'), me=box.querySelector('#rme'), nt=box.querySelector('#rnt');
    if(!(j&&j.ok)){ ol.innerHTML=''; const li=document.createElement('li'); li.className='wait'; li.textContent=j&&j.msg==='busy'?'잠깐 뒤에 다시 열어 주세요.':'순위표를 불러오지 못했어요. 잠시 뒤에 다시 열어 주세요.'; ol.append(li); return; }
    ol.innerHTML='';
    (j.top||[]).slice(0,10).forEach(o=>{ const li=document.createElement('li'); if(o.me) li.className='me';
      const b=document.createElement('b'), sp=document.createElement('span'), i=document.createElement('i');
      b.textContent=(+o.r||0)+'위'; sp.textContent=String(o.c||'').slice(0,14); i.textContent=(+o.n||0)+'개'; li.append(b,sp,i); ol.append(li); });
    if(!ol.children.length){ const li=document.createElement('li'); li.className='wait'; li.textContent='아직 순위에 오른 요원이 없어요.'; ol.append(li); }
    let t='';
    if(teacher()) t='선생님 모드라 순위에 들어가지 않아요. 순위에 오른 요원 '+(+j.total||0)+'명.';
    else if(j.hidden) t='이 기록은 본부가 순위에서 뺐어요.';
    else if(j.r) t=j.r<=10?'요원 '+j.code+' · 내 순위 '+j.r+'위 · 색 방울 '+(+j.sum||0)+'개.':'요원 '+j.code+' · 모은 색 방울 '+(+j.sum||0)+'개.';   // 10위 밖은 등수와 남은 개수를 보여 주지 않는다
    else t='요원 '+(j.code||agent().code)+' · 색 방울을 모으면 순위에 올라가요.';
    if(j.changed) t+=' 코드가 다른 요원과 겹쳐서 「'+j.code+'」로 바뀌었어요.';
    me.textContent=t; me.hidden=false; }); }

/* ---------- 라디오 곡 듣기 ----------
   곰이 땅을 딛고 라디오 앞에 서 있으면 아래 가운데에 「유튜브에서 듣기」가 뜬다. 누르면 새 창에서 그 곡을 유튜브에서 찾는다
   (곡마다 영상 주소를 넣어 두면 영상이 내려가거나 바뀔 때 끊기므로, 곡 이름과 가수로 찾는 주소를 쓴다). 안개 속(아직 지나오지 않은 곳)의 라디오는 꺼져 있다 */
const YT=document.getElementById('yt');
function ytShow(){ const on=!!(running&&!paused&&!room&&!warp&&!lift&&radio&&A.RADIO&&ov.hidden&&hv.hidden&&P&&P.ground&&radio.x<maxX+150&&Math.abs(P.x+P.w/2-(radio.x+14))<30);
  if(on){ const q=radio.s.t+(radio.s.a?' '+radio.s.a:''), u='https://www.youtube.com/results?search_query='+encodeURIComponent(q);
    if(YT.getAttribute('href')!==u){ YT.setAttribute('href',u); YT.setAttribute('aria-label','유튜브에서 '+q+' 듣기'); } }
  if(YT.hidden===on) YT.hidden=!on; }
YT.addEventListener('click',()=>{ K.l=K.r=K.j=K.b=false; });   // 새 창으로 넘어갈 때 누르고 있던 조작이 남지 않게
/* ---------- 돌리기 ---------- */
// 배경 음악: 판이 도는 동안만 튼다. 숨을 모을 때와 가만히 있어야 할 때는 작게, 안개에 물들면 먹먹하게.
function music(){ const okay=sound&&running&&AC&&AC.state==='running'&&!document.hidden;
  if(!okay){ BGM.pause(); return; }
  const calm=room||P.charging||(P.ground&&Math.abs(P.vx)<8&&swarms.some(s=>s.state==='alert'));
  if(!OPT.m){ BGM.pause(); return; }
  BGM.set((med?0:paused?.3:(calm?.28:1))*VOL[OPT.m],P.grey>0); BGM.play(AC); }
function frame(now){ const d=Math.min(.05,(now-last)/1000); last=now; music(); ytShow();
  if(running&&!paused){ acc+=d; while(acc>=1/120){ step(1/120); acc-=1/120; if(!running||paused){ acc=0; break; } } }
  draw(); requestAnimationFrame(frame); }
reset(); home(); requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{ last=performance.now(); if(document.hidden) BGM.pause(); });
window.G={get cush(){return cush;},get med(){return med;},get radio(){return radio;},get bolt(){return bolt;},boltSoon(){boltNext=tNow;},hold(v){paused=!!v;},get mood(){return mood;},set mood(v){mood=v;},get P(){return P;},lookChanged,K,step,reset,at,T,GY,press(){jBuf=.13;K.j=true;},get curtains(){return curtains;},get mungs(){return mungs;},get swarms(){return swarms;},get deaths(){return deaths;},get running(){return running;},get door(){return door;},get rot(){return rot;},get room(){return room;},get nook(){return nook;},get boss(){return bossC;},get walls(){return walls;},get AC(){return AC;},get warp(){return warp;},get stageNo(){return stageNo;},get lift(){return lift;},get stuck(){return stuck;},get flags(){return flags;},get cp(){return cp;},get cam(){return cam;},get maxX(){return maxX;},get camY(){return camY;},get W(){return W;},get H(){return H;},die(){respawn();},get bub(){return bubble&&{t:bubble.t,a:bubA};},get held(){return held;},get topR(){return topR;},get gusts(){return gusts;},get sign(){return sign;},get radio(){return radio;},say,get bubL(){return bubble&&bubble.lines?{n:bubble.lines.length,fs:bubble.fs,bw:bubble.bw,t:bubble.t}:null;},toHQ,get note(){return msg&&msg.until>tNow?msg.t:'';},
  get post(){return post;},
  go(n){stageNo=n||0;bonus=true;mood='sun';reset();play();}};
})();
</script>
